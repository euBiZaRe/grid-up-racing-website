        async function seedDatabase() {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = "Starting batch insert...\n";
            try {
                // First delete existing registrations
                logDiv.innerHTML += "Clearing old entries...\n";
                const snap = await db.collection('leagues').doc(EVENT_ID).collection('registrations').get();
                const clearBatch = db.batch();
                snap.forEach(doc => clearBatch.delete(doc.ref));
                await clearBatch.commit();
                logDiv.innerHTML += `Cleared ${snap.size} entries.\n`;

                const batch = db.batch();
                REGISTRATIONS.forEach((reg, idx) => {
                    const docRef = db.collection('leagues').doc(EVENT_ID).collection('registrations').doc('entry_' + idx);
                    reg.timestamp = firebase.firestore.FieldValue.serverTimestamp();
                    reg.avatar = "";
                    batch.set(docRef, reg);
                    logDiv.innerHTML += `Queued: ${reg.teamName || reg.name} \n`;
                });
                await batch.commit();
                logDiv.innerHTML += "\nSUCCESS: All entries seeded to Firestore!";
            } catch (e) {
                console.error(e);
                logDiv.innerHTML += `\nERROR: ${e.message}`;
            }
        }
