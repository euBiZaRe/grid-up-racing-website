# GitHub Pages Jekyll Configuration
# Include standard RFC 9116 security policy files
include:
  - .well-known
  - security.txt

# Exclude sensitive backend scripts, dev tooling, and build files from static deployment
exclude:
  - scripts/
  - tests/
  - scratch/
  - package.json
  - package-lock.json
  - firebase.json
  - firestore.rules
  - cors.json
  - README.md
