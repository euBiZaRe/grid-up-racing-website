        async function seedLegacyResults() {
            log("Starting legacy results seeding...");

            if (typeof db === 'undefined') {
                log("Firestore 'db' is not initialized. Make sure auth.js loaded correctly.", 'error');
                return;
            }

            try {
                // First, delete any existing results for these events to prevent duplicates
                const eventIdsToClear = [...new Set(legacyResults.map(r => r.eventId))];
                log(`Clearing existing results for: ${eventIdsToClear.join(', ')}`);
                
                for (let eventId of eventIdsToClear) {
                    const snap = await db.collection("event_results").where("eventId", "==", eventId).get();
                    if (!snap.empty) {
                        const batch = db.batch();
                        snap.forEach(doc => {
                            batch.delete(doc.ref);
                        });
                        await batch.commit();
                        log(`Cleared ${snap.size} old records for ${eventId}`);
                    }
                }

                // Now insert the new ones
                log("Inserting new records...");
                const batch = db.batch();
                
                legacyResults.forEach(result => {
                    const docRef = db.collection("event_results").doc(); // auto-ID
                    batch.set(docRef, result);
                });

                await batch.commit();
                log("Successfully seeded all legacy results!", 'success');

            } catch (error) {
                console.error(error);
                log(`Error: ${error.message}`, 'error');
            }
        }
