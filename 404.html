<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | GRiD UP Sim Racing</title>
        <!-- Preconnect & Asynchronous Google Fonts for PageSpeed optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/style.css?v=21">
    <link rel="icon" type="image/png" href="/assets/G_2.png">
    <style>
        /* Loading & Error Styles */
        .fallback-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 207, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Profile Specific Styles duplicated from driver-template.html */
        .profile-header {
            text-align: center;
            padding: 5rem 0 3rem;
            background: radial-gradient(circle at 50% 100%, rgba(0,207,255,0.05) 0%, transparent 70%);
        }
        .profile-nickname {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
            display: block;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-top: 3rem;
        }
        .stat-card {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.015);
        }
        .rating-group {
            margin-bottom: 1.75rem;
        }
        .rating-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .rating-bar-bg {
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        .rating-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            box-shadow: 0 0 12px rgba(0, 207, 255, 0.2);
        }
        .license-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 0.75rem;
            letter-spacing: 0.5px;
        }
        .license-a { background: rgba(0, 66, 209, 0.2); color: #4DA3FF; border: 1px solid rgba(0, 66, 209, 0.4); }
        .license-b { background: rgba(0, 143, 31, 0.2); color: #4ade80; border: 1px solid rgba(0, 143, 31, 0.4); }
        .license-c { background: rgba(247, 209, 23, 0.2); color: #facc15; border: 1px solid rgba(247, 209, 23, 0.4); }
        .license-d { background: rgba(252, 106, 3, 0.2); color: #fb923c; border: 1px solid rgba(252, 106, 3, 0.4); }
        .license-r { background: rgba(188, 188, 188, 0.1); color: #9ca3af; border: 1px solid rgba(188, 188, 188, 0.2); }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="container nav-content">
            <a href="/index.html" class="logo">
                <img src="/assets/logo.png" alt="GRiD UP" style="height: 40px; vertical-align: middle;">
            </a>
            <ul class="nav-links">
                <li><a href="/index.html#home">Home</a></li>
                <li><a href="/events.html">Events</a></li>
                <li><a href="/reports.html">News</a></li>
                <li><a href="/roster.html">Roster</a></li>
                <li><a href="telemetry.html">Telemetry</a></li>
                <li><a href="/team-app.html">Apply</a></li>
                <li><a href="/shop.html">Shop</a></li>
                <li><a href="https://discord.gg/gridup" target="_blank"><img src="/assets/discord_header.png" alt="Discord" style="height: 25px; vertical-align: middle;"></a></li>
                <li><a href="/login.html" id="login-link" class="btn btn-outline" style="padding: 0.5rem 1.25rem; font-size: 0.8rem; margin-left: 1rem;">Login</a></li>
                <li><a href="/index.html#about">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Content Area -->
    <div id="dynamic-content">
        <!-- Loading fallback by default -->
        <div class="fallback-container">
            <div class="spinner"></div>
            <p style="color: var(--text-muted);">Verifying requested page...</p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p style="color: var(--text-muted); font-size: 0.8rem;">&copy; 2026 GRiD UP SIM RACING. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script defer src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="/script.js?v=21"></script>
    <script src="/js/auth.js?v=12"></script>
    <script>
        // Check if the current URL points to a driver profile
        const path = window.location.pathname;
        const match = path.match(/\/drivers\/([^/]+)\.html$/i);

        if (match) {
            const rawSlug = match[1].toLowerCase();
            
            // Wait for DB to load
            let attempts = 0;
            const dbInterval = setInterval(async () => {
                attempts++;
                if (window.db) {
                    clearInterval(dbInterval);
                    try {
                        // 1. Try querying by slug
                        let snap = await window.db.collection("drivers").where("slug", "==", rawSlug).get();
                        
                        // 2. If not found by slug, try matching doc ID or name normalized
                        if (snap.empty) {
                            const allSnap = await window.db.collection("drivers").get();
                            for (const doc of allSnap.docs) {
                                const data = doc.data();
                                const docSlug = (data.slug || (data.name ? data.name.toLowerCase().replace(/['']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') : '')).toLowerCase();
                                if (docSlug === rawSlug || doc.id.toLowerCase() === rawSlug) {
                                    if (data.active !== false) {
                                        renderDriverProfile(data);
                                        return;
                                    }
                                }
                            }
                            render404();
                            return;
                        }

                        const driverData = snap.docs[0].data();
                        if (driverData.active !== false) {
                            renderDriverProfile(driverData);
                            return;
                        }
                        render404();
                    } catch (err) {
                        console.error("Error fetching driver:", err);
                        render404();
                    }
                } else if (attempts > 60) {
                    clearInterval(dbInterval);
                    render404();
                }
            }, 100);
        } else {
            render404();
        }

        function getLicenseClass(licenseStr) {
            if (!licenseStr || licenseStr === "N/A" || licenseStr === "---") return "license-r";
            const firstChar = licenseStr.charAt(0).toLowerCase();
            return "license-" + firstChar;
        }

        function renderDriverProfile(driver) {
            const name = driver.name || "Unknown Driver";
            const nickname = driver.nickname || "GRiD UP DRIVER";
            const role = driver.role || driver.category || "Team Driver";
            const memberSince = driver.memberSince || "2026";
            const g61Url = `https://garage61.net/app/drivers/${driver.slug || ''}`;
            
            // Format rating disciplines
            const stats = driver.stats || {};
            const iratings = stats.iRatings || {};
            const licenses = stats.licenseLevels || {};
            const percentages = stats.iRatingPercentages || {};
            const iracingObj = driver.iracing || {};
            const detailedRatings = iracingObj.ratings || {};
            const lastChecked = iracingObj.lastChecked ? iracingObj.lastChecked.substring(0, 10) : 'Recent';

            const disciplines = [
                { key: 'SPORTS', irKey: 'sportsCar', name: 'Sports Car' },
                { key: 'FORMULA', irKey: 'formulaCar', name: 'Formula Car' },
                { key: 'OVAL', irKey: 'oval', name: 'Oval' },
                { key: 'DIRT_ROAD', irKey: 'dirtRoad', name: 'Dirt Road' },
                { key: 'DIRT_OVAL', irKey: 'dirtOval', name: 'Dirt Oval' },
                { key: 'ROAD', irKey: 'road', name: 'Road' }
            ];

            const statsHtml = disciplines.map(disc => {
                const detailed = detailedRatings[disc.irKey] || {};
                let irVal = detailed.value || iratings[disc.key] || 0;
                let displayIr = irVal > 0 ? String(irVal) : '---';
                let ratingDate = detailed.updated || '';
                let lic = licenses[disc.key] || 'R 2.50';
                let licClass = getLicenseClass(lic);
                let pc = percentages[disc.key] || (irVal > 0 ? Math.min(100, Math.round((irVal / 4000) * 100)) : 0);

                return `
                    <div class="rating-group">
                        <div class="rating-label">
                            <div class="rating-label-left">
                                <span>${disc.name}</span>
                                <span class="license-badge ${licClass}">${lic}</span>
                            </div>
                            <div class="rating-score-box">
                                <span class="rating-score">${displayIr}</span>
                                ${ratingDate ? `<span class="rating-when">${ratingDate}</span>` : ''}
                            </div>
                        </div>
                        <div class="rating-bar-bg"><div class="rating-bar-fill" style="width: ${pc}%;"></div></div>
                    </div>
                `;
            }).join('');

            const info = driver.info || {};
            const age = info.age || "N/A";
            const country = info.country || "N/A";
            const favCar = info.favCar || "N/A";
            const favTrack = info.favTrack || "N/A";
            const advice = info.advice || "N/A";

            document.title = `${name} | Driver Profile | GRiD UP Sim Racing`;

            document.getElementById("dynamic-content").innerHTML = `
                <main class="container section">
                    <div class="profile-container">
                        
                        <!-- Left Panel: Driver Card -->
                        <div class="driver-hero-card">
                            <div class="driver-avatar-container" id="driver-avatar-container">
                                <svg class="driver-avatar-placeholder" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                                </svg>
                            </div>
                            
                            <div class="driver-name-wrap">
                                <span class="profile-nickname" style="color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; font-size: 0.75rem; margin-bottom: 0.25rem; display: block;">${nickname}</span>
                                <h1 class="driver-main-name">${name}</h1>
                                <div id="verified-badge-container" style="display: none; justify-content: center;">
                                    <span class="verified-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                        Verified
                                    </span>
                                </div>
                            </div>

                            <div class="driver-meta-list">
                                <div class="driver-meta-item">
                                    <span class="driver-meta-label">Team Role</span>
                                    <span class="driver-meta-val">${role}</span>
                                </div>
                                <div class="driver-meta-item">
                                    <span class="driver-meta-label">Member Since</span>
                                    <span class="driver-meta-val">${memberSince}</span>
                                </div>
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                                ${driver.slug ? `<a href="${g61Url}" target="_blank" class="btn" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); width: 100%; font-size: 0.75rem; padding: 0.6rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Garage 61 Profile</a>` : ''}
                                
                                <div id="claim-section" style="display: none; width: 100%;">
                                    <button class="btn btn-outline claim-btn" onclick="openClaimModal()" style="font-size: 0.75rem; padding: 0.6rem; width: 100%; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Claim Profile</button>
                                </div>
                            </div>
                        </div>

                        <!-- Right Panel: Dashboard -->
                        <div class="dashboard-container">
                            
                            <!-- iRacing Ratings Card -->
                            <div class="dashboard-card">
                                <div class="card-header-row">
                                    <h3 class="card-title-text">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                                        iRacing Ratings
                                    </h3>
                                    <span class="ratings-last-checked">Checked: ${lastChecked}</span>
                                </div>
                                ${statsHtml}
                            </div>

                            <!-- Driver Bio Info Card -->
                            <div class="dashboard-card">
                                <div class="card-header-row">
                                    <h3 class="card-title-text">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                        Driver Profile Details
                                    </h3>
                                </div>

                                <div class="bio-info-grid">
                                    <div class="bio-item">
                                        <span class="bio-lbl">Age</span>
                                        <span class="bio-val" id="profile-age">${age}</span>
                                    </div>
                                    <div class="bio-item">
                                        <span class="bio-lbl">Country</span>
                                        <span class="bio-val" id="profile-country">${country}</span>
                                    </div>
                                    <div class="bio-item span-2">
                                        <span class="bio-lbl">Favourite Car</span>
                                        <span class="bio-val" id="profile-fav-car">${favCar}</span>
                                    </div>
                                    <div class="bio-item span-2">
                                        <span class="bio-lbl">Favourite Track</span>
                                        <span class="bio-val" id="profile-fav-track">${favTrack}</span>
                                    </div>
                                    <div class="bio-item span-2">
                                        <span class="bio-lbl">Advice for New Sim Racers</span>
                                        <span class="bio-val advice-text" id="profile-advice">"${advice}"</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 5rem;">
                        <a href="/roster.html" class="btn btn-outline" style="padding: 0.8rem 2.5rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; font-size: 0.8rem;">← Back to Roster</a>
                    </div>
                </main>
            `;

            // Initialize claim modal handler
            window.openClaimModal = function() {
                if (confirm("Are you sure you want to claim this driver profile?")) {
                    if (typeof claimProfile === 'function') {
                        claimProfile(name);
                    }
                }
            };

            // Hook into auth.js helpers
            if (window.checkClaimVisibility) {
                window.checkClaimVisibility(name);
            }
            if (window.loadDriverCustomInfo) {
                window.loadDriverCustomInfo(name);
            }
        }

        function render404() {
            document.title = "404 - Page Not Found | GRiD UP Sim Racing";
            document.getElementById("dynamic-content").innerHTML = `
                <div class="fallback-container">
                    <h1 class="glow-text" style="font-size: 8rem; line-height: 1.1; margin-bottom: 1rem;">404</h1>
                    <h2 style="margin-bottom: 1.5rem; font-weight: 600;">PAGE NOT FOUND</h2>
                    <p style="color: var(--text-muted); max-width: 500px; margin-bottom: 3rem; line-height: 1.6;">
                        The page you are looking for does not exist or has been moved. Use the navigation links above or return to the home page.
                    </p>
                    <a href="/index.html" class="btn" style="padding: 1rem 3rem; background: var(--primary); color: #000; font-weight: 700;">Go To Home</a>
                </div>
            `;
        }
    </script>
</body>
