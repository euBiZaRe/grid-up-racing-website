<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Results | GRiD UP Sim Racing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/G_2.png">
    <style>
        #text-results-container {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            margin-top: 2rem;
            margin-bottom: 4rem;
        }

        .event-result-block {
            padding: 2rem;
        }

        .results-table-container table th {
            color: var(--text);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
        
        .results-table-container table td {
            vertical-align: middle;
        }
        
        .results-table-container table tbody tr:hover {
            background: rgba(0, 207, 255, 0.05);
        }
    </style>
</head>
<body class="results-page">
    <nav id="navbar" class="scrolled">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="GRiD UP" style="height: 40px; vertical-align: middle;">
            </a>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="team-app.html">Team App</a>
                <a href="roster.html">Roster</a>
                <a href="events.html">Events</a>
                <a href="shop.html">Shop</a>
                <a href="https://discord.gg/gridup" target="_blank"><img src="assets/discord_header.png" alt="Discord" style="height: 25px; vertical-align: middle;"></a>
                <a href="login.html" id="login-link" class="btn btn-outline" style="padding: 0.5rem 1.25rem; font-size: 0.8rem; margin-left: 1rem;">Login</a>
            </div>
        </div>
    </nav>

    <header class="hero hero-small">
        <img src="assets/bg-banner.png" alt="Race Results" class="hero-img" style="opacity: 0.3;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="glow-text">Race Results</h1>
            <p style="color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">The Data Hub: Complete Team Results History</p>
        </div>
    </header>

    <main class="container section" style="position: relative; overflow: hidden; padding-bottom: 2rem; min-height: 50vh;">
        <div class="tread-overlay" style="opacity: 0.05;"></div>
        
        <div id="text-results-container">
            <p style="text-align: center; color: var(--text-muted); width: 100%;">Loading historic race results...</p>
        </div>

        <div style="text-align: center; margin-top: 4rem;">
            <a href="index.html" class="btn btn-outline">Back to Home</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p style="color: var(--text-muted); font-size: 0.8rem;">&copy; 2026 GRiD UP SIM RACING. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="script.js?v=6"></script>
    <script src="js/auth.js"></script>
</body>
</html>
