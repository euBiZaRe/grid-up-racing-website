<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Results | GRiD UP Sim Racing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/G_2.png">
    <style>
        #all-results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
            margin-bottom: 4rem;
        }

        /* Responsive sizing to match cinematic ratio roughly */
        #all-results-grid .card.cinematic-poster {
            aspect-ratio: 16/9;
            height: auto;
            min-height: auto;
        }

        @media (max-width: 768px) {
            #all-results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="results-page">
    <nav id="navbar" class="scrolled">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="assets/logo.png" alt="GRiD UP" style="height: 40px; vertical-align: middle;">
            </a>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="nav-links">
                <a href="index.html#home">Home</a>
                <a href="index.html#about">About</a>
                <a href="team-app.html">Team App</a>
                <a href="roster.html">Roster</a>
                <a href="events.html">Events</a>
                <a href="shop.html">Shop</a>
                <a href="https://discord.gg/gridup" target="_blank"><img src="assets/discord_header.png" alt="Discord" style="height: 25px; vertical-align: middle;"></a>
                <a href="login.html" id="login-link" class="btn btn-outline" style="padding: 0.5rem 1.25rem; font-size: 0.8rem; margin-left: 1rem;">Login</a>
            </div>
        </div>
    </nav>

    <header class="hero hero-small">
        <img src="assets/bg-banner.png" alt="Race Results" class="hero-img" style="opacity: 0.3;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="glow-text">Race Results</h1>
            <p style="color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">The Trophy Room: Past Triumphs of the GRiD UP Squad</p>
        </div>
    </header>

    <main class="container section" style="position: relative; overflow: hidden; padding-bottom: 2rem; min-height: 50vh;">
        <div class="tread-overlay" style="opacity: 0.05;"></div>
        
        <div id="all-results-grid">
            <p style="text-align: center; color: var(--text-muted); width: 100%; grid-column: 1/-1;">Loading historic race results...</p>
        </div>

        <div style="text-align: center; margin-top: 4rem;">
            <a href="index.html" class="btn btn-outline">Back to Home</a>
        </div>
    </main>

    <footer>
        <div class="container">
            <p style="color: var(--text-muted); font-size: 0.8rem;">&copy; 2026 GRiD UP SIM RACING. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- Cinematic Card Modal (Expansion Overlay) -->
    <div id="card-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; padding: 2rem; align-items: center; justify-content: center; backdrop-filter: blur(15px); transition: all 0.3s ease;">
        <div style="position: relative; max-width: 1100px; width: 100%; aspect-ratio: 16/9; transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);" id="modal-container">
            <!-- Content will be injected by JavaScript -->
        </div>
        
        <div style="position: absolute; top: 2rem; right: 2rem; display: flex; gap: 1rem;">
            <button onclick="downloadActiveCard()" class="btn" style="background: var(--primary); color: #000; font-weight: 900; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 30px rgba(0,207,255,0.3);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                DOWNLOAD HD POSTER
            </button>
            <button onclick="closeCardModal()" class="btn btn-outline" style="border-radius: 50%; width: 50px; height: 50px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">&times;</button>
        </div>
    </div>

    <!-- Background Canvas for High-Res Exports -->
    <canvas id="export-canvas" style="display: none;"></canvas>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="script.js?v=5"></script>
    <script src="js/auth.js"></script>
</body>
</html>
