    <!-- Rich Telemetry Dashboard Styles -->
    <style>
        .telemetry-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }
        
        .dashboard-header {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 2rem;
        }
        
        @media (min-width: 768px) {
            .dashboard-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        
        .live-badge-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .live-text {
            color: #10b981;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .selector-label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .team-selector-wrapper {
            position: relative;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 250px;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s ease;
        }

        .team-selector-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .team-selector-wrapper select {
            background: transparent;
            border: none;
            outline: none;
            color: #e5e5e5;
            font-size: 0.9rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            padding-right: 1.5rem;
        }

        .select-arrow {
            position: absolute;
            right: 1rem;
            pointer-events: none;
            color: var(--text-muted);
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-t: 5px solid var(--text-muted);
        }

        .telemetry-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .telemetry-layout {
                grid-template-columns: 1.2fr 1fr;
                align-items: start;
            }
        }

        .drivers-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .race-info-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: sticky;
            top: 2rem;
        }

        .info-widget {
            background: rgba(20, 20, 20, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .info-widget-title {
            font-size: 0.75rem;
            font-weight: 850;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.5rem;
        }

        .driver-card {
            background: rgba(20, 20, 20, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .driver-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }

        .driver-info-block {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .driver-avatar {
            width: 40px;
            height: 40px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .driver-name {
            font-size: 1.15rem;
            font-weight: 800;
            margin: 0;
            color: #ffffff;
        }

        .driver-metadata {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .car-num-tag {
            font-size: 0.65rem;
            font-family: monospace;
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .session-info {
            text-align: right;
        }

        .session-sid {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        .session-track {
            font-size: 0.75rem;
            font-weight: 700;
            color: #e5e5e5;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        @media (min-width: 480px) {
            .metrics-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .metric-card {
            background: rgba(10, 10, 10, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .metric-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .metric-val {
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 0.5rem;
        }

        .metric-val span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-left: 0.15rem;
        }

        .pedals-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .pedal-bar-wrapper {
            width: 100%;
        }

        .pedal-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .pedal-bar-bg {
            height: 10px;
            width: 100%;
            background: #0c0c0c;
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .pedal-bar-fill {
            height: 100%;
            border-radius: 9999px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .throttle-fill {
            background: linear-gradient(90deg, #059669, #34d399);
        }

        .brake-fill {
            background: linear-gradient(90deg, #dc2626, #f87171);
        }

        .progression-container {
            background: rgba(10, 10, 10, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1rem;
        }

        .progression-bar-bg {
            height: 8px;
            width: 100%;
            background: #181818;
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progression-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            transition: width 0.2s ease;
        }

        .tyre-container {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .tyre-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            max-width: 320px;
            margin: 0 auto;
            position: relative;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 16px;
        }

        .car-outline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 60px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            pointer-events: none;
        }

        .tyre-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.6rem;
            border-radius: 12px;
            text-align: center;
        }

        .tyre-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .tyre-press {
            font-size: 0.85rem;
            font-weight: 950;
            color: #e5e5e5;
        }

        .tyre-temp {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }

        .card-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .loading-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 0;
            gap: 1rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5rem 2rem;
            background: rgba(20, 20, 20, 0.3);
            border: 1px dashed rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            max-width: 550px;
            margin: 0 auto;
            text-align: center;
        }

        .empty-icon {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .empty-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #e5e5e5;
            margin-bottom: 0.5rem;
        }

        .empty-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .standings-container {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .table-scroll-container {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            background: rgba(10, 10, 10, 0.4);
        }

        .table-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 999px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.825rem;
            text-align: left;
        }

        .standings-table th {
            color: var(--text-muted);
            font-weight: 700;
            padding: 0.65rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.05em;
            position: sticky;
            top: 0;
            background: #141414;
            z-index: 10;
        }

        .standings-table td {
            padding: 0.65rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #e5e7eb;
        }

        .standings-row-player {
            background: rgba(16, 185, 129, 0.12) !important;
        }

        .standings-row-player td {
            color: #34d399 !important;
            font-weight: 800;
        }

        .laptime-mono {
            font-family: monospace;
            font-weight: 600;
        }

        /* PREMIUM TAB BAR */
        .telemetry-tabs {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 1rem;
            background: rgba(10, 10, 10, 0.6);
            padding: 0.25rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: fit-content;
        }

        .telemetry-tab-btn {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .telemetry-tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
        }

        .telemetry-tab-btn.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        /* ===== LIVE TRACK MAP WIDGET ===== */
        .track-map-canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background: rgba(6, 6, 6, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
        }

        .track-map-canvas-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .track-map-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 0.75rem;
            gap: 0.5rem;
        }

        .track-map-legend {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .track-map-legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .track-map-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>

            <p style="color: var(--text-muted); font-size: 0.8rem; margin: 0; padding-bottom: 1rem;">&copy; 2026 GRiD UP SIM RACING. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

    <!-- Firebase Compat SDK dependencies -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="js/auth.js?v=4"></script>

    <!-- Realtime Telemetry Sync Logic -->
    <script>
        // ===== TRACK MAP ENGINE (60fps Progress-Interpolated) =====
        let serverTimeOffset = 0;
        let trackMapData = null;
        let trackMapSvgNS = 'http://www.w3.org/2000/svg';
        let trackMapCurrentId = null;
        let trackMapPathEl = null;
        let trackMapPathLength = 0;
        let trackMapBBox = null;
        let trackMapAnimFrame = null;
        let trackMapActiveTrackData = null;
        let trackMapCanvasEl = null;
        let trackMapStaticCanvas = null;
        let trackMapStaticW = 0;
        let trackMapStaticH = 0;
        // Per-driver state keyed by carNum: { progress, targetProgress, isPlayer, classColor, carNum }
        let trackMapDrivers = {};
        let trackMapLastTimestamp = null;

        // Load track map data
        fetch('js/track-maps.json')
            .then(r => r.json())
            .then(data => {
                trackMapData = data;
                console.log(`[TrackMap] Loaded ${Object.keys(data).length} track maps`);
                if (typeof renderDashboard === 'function') renderDashboard();
            })
            .catch(err => console.warn('[TrackMap] Failed to load track maps:', err));

        // Create off-screen SVG for path calculations
        function trackMapInitPath(svgPathD) {
            if (!trackMapPathEl) {
                const svg = document.createElementNS(trackMapSvgNS, 'svg');
                svg.setAttribute('width', '0');
                svg.setAttribute('height', '0');
                svg.style.position = 'absolute';
                svg.style.visibility = 'hidden';
                svg.style.pointerEvents = 'none';
                document.body.appendChild(svg);
                trackMapPathEl = document.createElementNS(trackMapSvgNS, 'path');
                svg.appendChild(trackMapPathEl);
            }
            trackMapPathEl.setAttribute('d', svgPathD);
            trackMapPathLength = trackMapPathEl.getTotalLength();
            trackMapBBox = trackMapPathEl.getBBox();
            trackMapStaticCanvas = null;
        }

        // Convert progress (0-1) to x,y on the track path
        function trackMapProgressToXY(progress, trackData) {
            if (!trackMapPathEl || !trackData) return null;
            const totalLength = trackMapPathLength;
            const sfLength = trackData.sp ? trackData.sp.l : 0;
            const direction = trackData.sd || 'clockwise';

            const adjustedLength = (totalLength * progress) % totalLength;
            const length = (direction === 'anticlockwise')
                ? (sfLength + adjustedLength) % totalLength
                : (sfLength - adjustedLength + totalLength) % totalLength;

            const svgLength = (length / trackData.l) * trackMapPathLength;
            const pt = trackMapPathEl.getPointAtLength(svgLength);
            return { x: pt.x, y: pt.y };
        }

        // Called by renderDashboard() — sets target progress, does NOT draw
        function trackMapUpdateTargets(drivers, trackData) {
            if (!drivers || !trackData) return;
            trackMapActiveTrackData = trackData;

            const now = Date.now();
            const activeKeys = new Set();
            Object.entries(drivers).forEach(([idx, d]) => {
                if (!d || typeof d.progress !== 'number' || d.progress < 0) return;
                const key = d.carNum || idx;
                activeKeys.add(key);

                if (!trackMapDrivers[key]) {
                    trackMapDrivers[key] = {
                        progress: d.progress,
                        targetProgress: d.progress,
                        progressVelocity: 0,
                        lastUpdateTime: now,
                        isPlayer: d.isPlayer,
                        classColor: d.classColor,
                        carNum: d.carNum || '',
                    };
                } else {
                    const dState = trackMapDrivers[key];
                    const oldTarget = dState.targetProgress;
                    const oldTime = dState.lastUpdateTime;
                    const dt = now - oldTime;

                    if (dt > 50 && dt < 2000) {
                        let diff = d.progress - oldTarget;
                        if (diff > 0.5) diff -= 1.0;
                        if (diff < -0.5) diff += 1.0;

                        const instantVelocity = diff / dt; // progress per ms
                        if (dState.progressVelocity === 0) {
                            dState.progressVelocity = instantVelocity;
                        } else {
                            // High-damping low-pass filter to keep speed estimate extremely stable
                            dState.progressVelocity = dState.progressVelocity * 0.88 + instantVelocity * 0.12;
                        }
                    }

                    dState.targetProgress = d.progress;
                    dState.lastUpdateTime = now;
                    dState.isPlayer = d.isPlayer;
                    dState.classColor = d.classColor;
                    dState.carNum = d.carNum || '';
                }
            });

            Object.keys(trackMapDrivers).forEach(key => {
                if (!activeKeys.has(key)) delete trackMapDrivers[key];
            });
        }

        // Lerp progress with circular wraparound (handles 0.99 → 0.01 correctly)
        function lerpProgressCircular(current, target, factor) {
            let diff = target - current;
            if (diff > 0.5) diff -= 1.0;
            if (diff < -0.5) diff += 1.0;
            let result = current + diff * factor;
            if (result < 0) result += 1.0;
            if (result >= 1.0) result -= 1.0;
            return result;
        }

        // Draw static track layers into an offscreen canvas (cached)
        function trackMapBuildStaticLayer(cw, ch, trackData, scale, offsetX, offsetY) {
            const offscreen = document.createElement('canvas');
            const dpr = window.devicePixelRatio || 1;
            offscreen.width = cw * dpr;
            offscreen.height = ch * dpr;
            const ctx = offscreen.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            const path = new Path2D(trackData.i);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 28 / scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke(path);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 12 / scale;
            ctx.stroke(path);

            if (trackData.sp) {
                const sfSvgLen = (trackData.sp.l / trackData.l) * trackMapPathLength;
                const sfPt = trackMapPathEl.getPointAtLength(sfSvgLen);
                const sfPt2 = trackMapPathEl.getPointAtLength(sfSvgLen + 1);
                const dx = sfPt2.x - sfPt.x;
                const dy = sfPt2.y - sfPt.y;
                const mag = Math.sqrt(dx * dx + dy * dy) || 1;
                const perpX = -dy / mag;
                const perpY = dx / mag;
                const lineLen = 25;

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 5 / scale;
                ctx.lineCap = 'butt';
                ctx.beginPath();
                ctx.moveTo(sfPt.x - perpX * lineLen, sfPt.y - perpY * lineLen);
                ctx.lineTo(sfPt.x + perpX * lineLen, sfPt.y + perpY * lineLen);
                ctx.stroke();
            }

            ctx.restore();
            return offscreen;
        }

        let trackMapLastFrameTime = Date.now();

        // 60fps animation loop — interpolates progress along the track path
        function trackMapAnimLoop() {
            trackMapAnimFrame = requestAnimationFrame(trackMapAnimLoop);

            const canvas = trackMapCanvasEl || document.getElementById('track-map-canvas');
            if (!canvas || !trackMapBBox || !trackMapActiveTrackData) return;
            trackMapCanvasEl = canvas;

            const parentEl = canvas.parentElement;
            if (!parentEl) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = parentEl.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            const cw = rect.width;
            const ch = rect.height;

            const targetW = Math.round(cw * dpr);
            const targetH = Math.round(ch * dpr);
            if (canvas.width !== targetW || canvas.height !== targetH) {
                canvas.width = targetW;
                canvas.height = targetH;
                trackMapStaticCanvas = null;
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const pad = 30;
            const bbox = trackMapBBox;
            const scaleX = (cw - pad * 2) / bbox.width;
            const scaleY = (ch - pad * 2) / bbox.height;
            const scale = Math.min(scaleX, scaleY);
            const offsetX = (cw - bbox.width * scale) / 2 - bbox.x * scale;
            const offsetY = (ch - bbox.height * scale) / 2 - bbox.y * scale;

            if (!trackMapStaticCanvas || trackMapStaticW !== cw || trackMapStaticH !== ch) {
                trackMapStaticCanvas = trackMapBuildStaticLayer(cw, ch, trackMapActiveTrackData, scale, offsetX, offsetY);
                trackMapStaticW = cw;
                trackMapStaticH = ch;
            }

            ctx.clearRect(0, 0, cw, ch);
            ctx.drawImage(trackMapStaticCanvas, 0, 0, cw, ch);

            const tData = trackMapActiveTrackData;
            const now = Date.now();
            const dt = now - trackMapLastFrameTime;
            trackMapLastFrameTime = now;

            // Clamp dt to avoid physics jumps when tab goes out of focus
            const clampedDt = Math.min(dt, 100);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            const sortedKeys = Object.keys(trackMapDrivers).sort((a, b) => {
                return (trackMapDrivers[a].isPlayer ? 1 : 0) - (trackMapDrivers[b].isPlayer ? 1 : 0);
            });

            sortedKeys.forEach(key => {
                const d = trackMapDrivers[key];
                if (!d) return;

                // 1. Integrate visual position at the estimated velocity
                let nextProgress = d.progress + d.progressVelocity * clampedDt;
                nextProgress = (nextProgress % 1.0 + 1.0) % 1.0;

                // 2. Gently correct the position using a time-independent soft lerp (lambda = 1.2)
                const dtSec = clampedDt / 1000;
                const correctionFactor = 1 - Math.exp(-1.2 * dtSec);
                d.progress = lerpProgressCircular(nextProgress, d.targetProgress, correctionFactor);

                // Compute x,y from smoothed progress
                const pos = trackMapProgressToXY(d.progress, tData);
                if (!pos) return;

                const radius = d.isPlayer ? (16 / scale) : (11 / scale);
                const fontSize = (d.isPlayer ? 11 : 8.5) / scale;

                if (d.isPlayer) {
                    ctx.shadowColor = '#f59e0b';
                    ctx.shadowBlur = 12 / scale;
                    ctx.fillStyle = '#f59e0b';
                } else {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = d.classColor ? `#${d.classColor}` : '#6b7280';
                }

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${fontSize}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(d.carNum, pos.x, pos.y);
            });

            ctx.restore();
        }

        // Start the animation loop
        trackMapAnimLoop();

        // Update the track map legend
        function trackMapUpdateLegend(drivers) {
            const legend = document.getElementById('track-map-legend');
            if (!legend) return;

            // Collect unique classes
            const classes = {};
            if (drivers) {
                Object.values(drivers).forEach(d => {
                    if (d && d.className && d.classColor) {
                        classes[d.className] = d.classColor;
                    }
                });
            }

            let html = '<div class="track-map-legend-item"><div class="track-map-legend-dot" style="background: #f59e0b; box-shadow: 0 0 6px #f59e0b;"></div> You</div>';
            html += '<div class="track-map-legend-item"><div class="track-map-legend-dot" style="background: #ef4444;"></div> S/F Line</div>';
            Object.keys(classes).forEach(name => {
                html += `<div class="track-map-legend-item"><div class="track-map-legend-dot" style="background: #${classes[name]};"></div> ${name}</div>`;
            });
            legend.innerHTML = html;
        }

        // Tab state tracking (mid -> tab name: 'standings' or 'relative')
        let activeTabs = {};

        window.switchTab = function(mid, tabName) {
            activeTabs[mid] = tabName;
            // Force re-render of dashboard
            if (window.forceRenderDashboard) {
                window.forceRenderDashboard();
            }
        };

        // Formatter for lap times (secs -> m:ss.ms)
        function formatLapTime(secs) {
            if (!secs || secs <= 0) return "--:--.---";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            const milliseconds = Math.floor((secs % 1) * 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
        }

        // Init Lucide Icons
        lucide.createIcons();

        // Target references
        const teamSelect = document.getElementById('team-select');
        const telemetryContent = document.getElementById('telemetry-content');
        
        let streamsRef = null;
        let driversRef = null;
        let presenceCheckInterval = null;

        // Start listening to Firebase database events
        function setupFirebaseListeners(teamId) {
            // Unsubscribe existing listeners if any
            if (streamsRef) streamsRef.off();
            if (driversRef) driversRef.off();
            if (presenceCheckInterval) clearInterval(presenceCheckInterval);
            presenceCheckInterval = setInterval(() => {
                if (typeof renderDashboard === "function") renderDashboard();
            }, 5000);

            let database;
            try {
                // Initialize a secondary, independent app named "telemetry" to avoid credential
                // collisions with the main "grid-up" authenticated app.
                let telemetryApp = firebase.apps.find(app => app.name === "telemetry");
                if (!telemetryApp) {
                    telemetryApp = firebase.initializeApp({
                        databaseURL: "https://grid-up-racedash-default-rtdb.europe-west1.firebasedatabase.app"
                    }, "telemetry");
                }
                database = telemetryApp.database();
            } catch (err) {
                console.error("Firebase secondary app init failed:", err);
                database = firebase.database();
            }

            // Listen to server time offset to correct local clock drift
            database.ref(".info/serverTimeOffset").on("value", (snap) => {
                serverTimeOffset = snap.val() || 0;
            });

            streamsRef = database.ref(`teams/${teamId}/streams`);
            driversRef = database.ref(`teams/${teamId}/drivers`);

            let currentStreams = {};
            let currentDrivers = {};

            // Render updates helper
            function renderDashboard() {
                const now = Date.now() + serverTimeOffset;
                const activeMids = Object.keys(currentStreams).filter(mid => {
                    const stream = currentStreams[mid];
                    const presence = currentDrivers[mid] || {};
                    const isOnline = presence.status === 'online';
                    const isRecent = presence.lastActive && (now - presence.lastActive) < 15000;
                    return stream && isOnline && isRecent;
                });
                
                if (activeMids.length === 0) {
                    telemetryContent.innerHTML = `
                        <div class="empty-wrapper">
                            <i data-lucide="activity" class="empty-icon" style="width: 48px; height: 48px;"></i>
                            <div class="empty-title">No Active Streams</div>
                            <div class="empty-desc">No drivers are currently streaming telemetry on team "${teamId}". Run the recorder client and drive in iRacing to go live!</div>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                // 1. Render Driver Telemetry Cards (LEFT column)
                let driversHtml = '<div class="drivers-column">';
                activeMids.forEach(mid => {
                    const streamData = currentStreams[mid];
                    const tel = streamData.telemetry || {};
                    const session = streamData.session || {};
                    const presence = currentDrivers[mid] || {};
                    const driverName = presence.name || tel.drivers?.[tel.playerIdx]?.name || "Active Driver";

                    const speedKmh = Math.round((tel.speed || 0) * 3.6);
                    const gearText = tel.gear === 0 ? "N" : tel.gear === -1 ? "R" : tel.gear;
                    const progressPct = Math.min(Math.max((tel.progress || 0) * 100, 0), 100);

                    // Pedals
                    const throttleVal = tel.throttle || 0;
                    const brakeVal = tel.brake || 0;

                    // Tyres
                    const tyres = tel.health?.tyres || {};
                    const lf = tyres.LF || {};
                    const rf = tyres.RF || {};
                    const lr = tyres.LR || {};
                    const rr = tyres.RR || {};

                    driversHtml += `
                        <div class="driver-card" id="card-${mid}">
                            <!-- Card Header -->
                            <div class="card-header">
                                <div class="driver-info-block">
                                    <div class="driver-avatar">
                                        <i data-lucide="user" style="width: 20px; height: 20px;"></i>
                                    </div>
                                    <div>
                                        <h3 class="driver-name">${driverName}</h3>
                                        <div class="driver-metadata">
                                            <span class="car-num-tag">Car #${presence.carNum || tel.carNum || "-"}</span>
                                            <span style="font-size: 0.65rem; color: #10b981; font-weight: bold; display: flex; align-items: center; gap: 4px;">
                                                <span class="live-dot" style="margin-right: 0;"></span> Live
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="session-info">
                                    <span class="session-sid">Session ID: ${session.sid || "N/A"}</span>
                                    <div class="session-track">
                                        <i data-lucide="map" style="width: 12px; height: 12px;"></i>
                                        <span>${session.trackName || "iRacing UI"}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Metrics Core -->
                            <div class="metrics-grid">
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="gauge" style="width: 12px; height: 12px;"></i> Speed</span>
                                    <div class="metric-val">${speedKmh}<span>km/h</span></div>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="zap" style="width: 12px; height: 12px;"></i> Gear</span>
                                    <div class="metric-val" style="color: #34d399;">${gearText} <span style="font-size: 0.65rem; font-weight: 500;">(${tel.rpm || 0} RPM)</span></div>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="droplet" style="width: 12px; height: 12px;"></i> Fuel</span>
                                    <div class="metric-val">${tel.fuel || 0}<span>L</span></div>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="check-circle-2" style="width: 12px; height: 12px;"></i> Position</span>
                                    <div class="metric-val">${tel.position || "P-"}<span>Class</span></div>
                                </div>
                            </div>

                            <!-- Throttle / Brake Pedals -->
                            <div class="pedals-container">
                                <div class="pedal-bar-wrapper">
                                    <div class="pedal-label">
                                        <span>Throttle</span>
                                        <span style="color: #34d399;">${throttleVal}%</span>
                                    </div>
                                    <div class="pedal-bar-bg">
                                        <div class="pedal-bar-fill throttle-fill" style="width: ${throttleVal}%;"></div>
                                    </div>
                                </div>
                                <div class="pedal-bar-wrapper">
                                    <div class="pedal-label">
                                        <span>Brake</span>
                                        <span style="color: #f87171;">${brakeVal}%</span>
                                    </div>
                                    <div class="pedal-bar-bg">
                                        <div class="pedal-bar-fill brake-fill" style="width: ${brakeVal}%;"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Progression Bar -->
                            <div class="progression-container">
                                <div class="pedal-label">
                                    <span>Lap Progression</span>
                                    <span style="color: #60a5fa;">${Math.round(progressPct)}%</span>
                                </div>
                                <div class="progression-bar-bg">
                                    <div class="progression-bar-fill" style="width: ${progressPct}%;"></div>
                                </div>
                                <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); margin-top: 0.5rem; font-family: monospace;">
                                    <span>Start / Finish</span>
                                    <span>Lap ${tel.lap || 0}</span>
                                </div>
                            </div>

                            <!-- Tyre Temperatures and Pressures -->
                            <div class="tyre-container">
                                <h4 class="metric-title" style="margin-bottom: 0.75rem;">
                                    <i data-lucide="thermometer" style="width: 14px; height: 14px;"></i> Tyre Telemetry (Psi / Temp)
                                </h4>
                                <div class="tyre-grid">
                                    <div class="car-outline"></div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">LF</div>
                                        <div class="tyre-press">${lf.p || 0} psi</div>
                                        <div class="tyre-temp">${lf.t || 0} °C</div>
                                    </div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">RF</div>
                                        <div class="tyre-press">${rf.p || 0} psi</div>
                                        <div class="tyre-temp">${rf.t || 0} °C</div>
                                    </div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">LR</div>
                                        <div class="tyre-press">${lr.p || 0} psi</div>
                                        <div class="tyre-temp">${lr.t || 0} °C</div>
                                    </div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">RR</div>
                                        <div class="tyre-press">${rr.p || 0} psi</div>
                                        <div class="tyre-temp">${rr.t || 0} °C</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                driversHtml += '</div>';

                // 2. Render Session Standings & Relative Gaps (RIGHT column)
                const primaryMid = activeMids[0];
                const primaryStream = currentStreams[primaryMid];
                const primaryTel = primaryStream.telemetry || {};
                const primaryPresence = currentDrivers[primaryMid] || {};
                const primaryDriverName = primaryPresence.name || primaryTel.drivers?.[primaryTel.playerIdx]?.name || "Active Driver";

                // Build Standings Rows
                let standingsRows = '';
                if (primaryTel.drivers) {
                    const sortedDrivers = Object.values(primaryTel.drivers)
                        .filter(d => d && d.pos > 0)
                        .sort((a, b) => a.pos - b.pos);
                    
                    sortedDrivers.forEach(d => {
                        const isPlayerRow = d.isPlayer ? 'class="standings-row-player"' : '';
                        const classIndicator = d.classColor ? `<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#${d.classColor}; margin-right:4px;"></span>` : '';
                        
                        standingsRows += `
                            <tr ${isPlayerRow}>
                                <td style="text-align: center; font-weight: bold;">${d.classPos || d.pos}</td>
                                <td><span class="car-num-tag">${d.carNum}</span></td>
                                <td><div style="display:flex; align-items:center; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${classIndicator}${d.name}</div></td>
                                <td style="text-align: center;">${d.lap || 0}</td>
                                <td style="text-align: right;" class="laptime-mono">${formatLapTime(d.lastLap)}</td>
                                <td style="text-align: right; color:#f3f4f6;" class="laptime-mono">${formatLapTime(d.bestLap)}</td>
                            </tr>
                        `;
                    });
                }
                if (!standingsRows) {
                    standingsRows = '<tr><td colspan="6" style="text-align:center; padding:1.5rem; color:var(--text-muted);">No standings data available</td></tr>';
                }

                // Build Relative Rows
                let relativeRows = '';
                if (primaryTel.drivers) {
                    const relativeDrivers = Object.values(primaryTel.drivers)
                        .filter(d => d && d.f2Time !== undefined)
                        .sort((a, b) => b.f2Time - a.f2Time);

                    relativeDrivers.forEach(d => {
                        const isPlayerRow = d.isPlayer ? 'class="standings-row-player"' : '';
                        const classIndicator = d.classColor ? `<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#${d.classColor}; margin-right:4px;"></span>` : '';
                        
                        let gapStr = '--';
                        let gapColor = '#e5e7eb';
                        if (d.isPlayer) {
                            gapStr = 'SELF';
                            gapColor = '#34d399';
                        } else if (d.f2Time > 0) {
                            gapStr = `+${d.f2Time.toFixed(1)}s`;
                            gapColor = '#f97316';
                        } else if (d.f2Time < 0) {
                            gapStr = `${d.f2Time.toFixed(1)}s`;
                            gapColor = '#3b82f6';
                        }

                        relativeRows += `
                            <tr ${isPlayerRow}>
                                <td style="text-align: center; font-weight: bold;">${d.classPos || d.pos}</td>
                                <td><span class="car-num-tag">${d.carNum}</span></td>
                                <td><div style="display:flex; align-items:center; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${classIndicator}${d.name}</div></td>
                                <td style="text-align: center; font-weight: bold; color: ${gapColor};">${gapStr}</td>
                                <td style="text-align: right;" class="laptime-mono">${formatLapTime(d.lastLap)}</td>
                                <td style="text-align: right; color:#f3f4f6;" class="laptime-mono">${formatLapTime(d.bestLap)}</td>
                            </tr>
                        `;
                    });
                }
                if (!relativeRows) {
                    relativeRows = '<tr><td colspan="6" style="text-align:center; padding:1.5rem; color:var(--text-muted);">No relative track data available</td></tr>';
                }

                // Verify if static layout structure is initialized
                let layout = document.getElementById('telemetry-layout-container');
                if (!layout) {
                    telemetryContent.innerHTML = `
                        <div class="telemetry-layout" id="telemetry-layout-container">
                            <div class="drivers-column" id="drivers-container"></div>
                            <div class="race-info-column" id="race-info-container">
                                <!-- Live Track Map Widget -->
                                <div class="info-widget" id="track-map-widget">
                                    <h3 class="info-widget-title">
                                        <i data-lucide="map-pin" style="width: 16px; height: 16px;"></i> Live Track Map
                                    </h3>
                                    <div class="track-map-canvas-wrapper" id="track-map-wrapper">
                                        <canvas id="track-map-canvas"></canvas>
                                    </div>
                                    <div class="track-map-legend" id="track-map-legend"></div>
                                </div>

                                <!-- Live Standings Widget -->
                                <div class="info-widget">
                                    <h3 class="info-widget-title">
                                        <i data-lucide="list-ordered" style="width: 16px; height: 16px;"></i> Live Session Standings
                                    </h3>
                                    <div class="table-scroll-container" id="standings-scroll">
                                        <table class="standings-table">
                                            <thead>
                                                <tr>
                                                    <th style="text-align: center; width: 40px;">Pos</th>
                                                    <th style="width: 50px;">Car</th>
                                                    <th>Driver</th>
                                                    <th style="text-align: center; width: 40px;">Lap</th>
                                                    <th style="text-align: right; width: 80px;">Last</th>
                                                    <th style="text-align: right; width: 80px;">Best</th>
                                                </tr>
                                            </thead>
                                            <tbody id="standings-body"></tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- Relative black box widget -->
                                <div class="info-widget">
                                    <h3 class="info-widget-title" style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="display: flex; align-items: center; gap: 0.5rem;">
                                            <i data-lucide="arrow-up-down" style="width: 16px; height: 16px;"></i> Relative
                                        </span>
                                        <span id="relative-driver-meta" style="font-size: 0.65rem; font-weight: 500; text-transform: none; color: var(--text-muted);">Relative</span>
                                    </h3>
                                    <div class="table-scroll-container" id="relative-scroll">
                                        <table class="standings-table">
                                            <thead>
                                                <tr>
                                                    <th style="text-align: center; width: 40px;">Pos</th>
                                                    <th style="width: 50px;">Car</th>
                                                    <th>Driver</th>
                                                    <th style="text-align: center; width: 60px;">Gap</th>
                                                    <th style="text-align: right; width: 80px;">Last</th>
                                                    <th style="text-align: right; width: 80px;">Best</th>
                                                </tr>
                                            </thead>
                                            <tbody id="relative-body"></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    lucide.createIcons();
                }

                // Update only dynamic bodies so the scroll containers are preserved in the DOM
                const driversContainer = document.getElementById('drivers-container');
                const standingsBody = document.getElementById('standings-body');
                const relativeBody = document.getElementById('relative-body');
                const relativeDriverMeta = document.getElementById('relative-driver-meta');

                if (driversContainer) {
                    driversContainer.innerHTML = driversHtml;
                }
                if (standingsBody) {
                    standingsBody.innerHTML = standingsRows;
                }
                if (relativeBody) {
                    relativeBody.innerHTML = relativeRows;
                }
                if (relativeDriverMeta) {
                    relativeDriverMeta.innerText = `Relative to: ${primaryDriverName}`;
                }

                // ===== UPDATE TRACK MAP =====
                const primarySession = primaryStream.session || {};
                const currentTrackId = String(primarySession.trackId || '');
                const trackWrapper = document.getElementById('track-map-wrapper');

                if (trackMapData && currentTrackId && trackMapData[currentTrackId]) {
                    const tData = trackMapData[currentTrackId];

                    // Ensure canvas element exists in the DOM (restores canvas if fallback overwrote it)
                    let canvas = document.getElementById('track-map-canvas');
                    if (!canvas && trackWrapper) {
                        trackWrapper.innerHTML = '<canvas id="track-map-canvas"></canvas>';
                        trackMapCanvasEl = null;
                        trackMapStaticCanvas = null;
                    }

                    // Initialize path if track changed
                    if (trackMapCurrentId !== currentTrackId) {
                        trackMapInitPath(tData.i);
                        trackMapCurrentId = currentTrackId;
                        // Reset smoothed positions on track change
                        trackMapDrivers = {};
                        trackMapCanvasEl = null;
                        trackMapStaticCanvas = null;
                        trackMapLastTimestamp = null;
                    }

                    // Feed new target positions to the animation loop (only on new telemetry frames)
                    if (primaryTel.timestamp && primaryTel.timestamp !== trackMapLastTimestamp) {
                        trackMapUpdateTargets(primaryTel.drivers, tData);
                        trackMapLastTimestamp = primaryTel.timestamp;
                    }
                    trackMapUpdateLegend(primaryTel.drivers);
                    if (trackWrapper) trackWrapper.style.display = '';
                } else if (trackWrapper) {
                    // Show fallback
                    if (!trackMapData) {
                        trackWrapper.innerHTML = '<div class="track-map-fallback"><i data-lucide="loader" style="width: 20px; height: 20px; animation: spin 2s linear infinite;"></i><span>Loading track maps...</span></div>';
                    } else {
                        trackWrapper.innerHTML = '<div class="track-map-fallback"><i data-lucide="map-pin-off" style="width: 20px; height: 20px;"></i><span>Track map unavailable for this circuit</span></div>';
                    }
                }

                window.forceRenderDashboard = renderDashboard;
                lucide.createIcons();
            }

            // Bind values
            streamsRef.on('value', snapshot => {
                currentStreams = snapshot.val() || {};
                renderDashboard();
            }, error => {
                console.error("Streams subscription failed:", error);
                telemetryContent.innerHTML = `
                    <div class="empty-wrapper">
                        <i data-lucide="alert-triangle" class="empty-icon" style="width: 48px; height: 48px; color: #ef4444;"></i>
                        <div class="empty-title" style="color: #ef4444;">Connection Error</div>
                        <div class="empty-desc">Failed to subscribe to streams: ${error.message}</div>
                    </div>
                `;
                lucide.createIcons();
            });

            driversRef.on('value', snapshot => {
                currentDrivers = snapshot.val() || {};
                renderDashboard();
            }, error => {
                console.error("Drivers subscription failed:", error);
            });
        }

        // Dropdown Event Listener
        teamSelect.addEventListener('change', (e) => {
            setupFirebaseListeners(e.target.value);
        });

        // Trigger on DOM Loaded
        function initDashboard() {
            let attempts = 0;
            const dbCheckInterval = setInterval(() => {
                attempts++;
                if (window.firebase) {
                    clearInterval(dbCheckInterval);
                    setupFirebaseListeners(teamSelect.value);
                } else if (attempts > 30) { // 3 seconds timeout
                    clearInterval(dbCheckInterval);
                    console.error("Firebase SDK failed to load within 3 seconds.");
                    telemetryContent.innerHTML = `
                        <div class="empty-wrapper">
                            <i data-lucide="alert-triangle" class="empty-icon" style="width: 48px; height: 48px; color: #ef4444;"></i>
                            <div class="empty-title" style="color: #ef4444;">SDK Load Error</div>
                            <div class="empty-desc">
                                The Firebase Database SDK failed to load. If you are using an adblocker (like uBlock Origin, Brave Shield, or AdBlock), 
                                please disable it or whitelist this domain so the telemetry dashboard can connect.
                            </div>
                        </div>
                    `;
                    lucide.createIcons();
                }
            }, 100);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDashboard);
        } else {
            initDashboard();
        }
    </script>
</body>
</html>
