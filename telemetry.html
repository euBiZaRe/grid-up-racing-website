    <style>
        .telemetry-container {
            max-width: 1300px;
            margin: 0 auto;

        .dashboard-header {
            display: flex;

        .live-badge-wrapper {

        }

            animation: pulse-green 2s infinite;
        }
        
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }

        .live-text {
            color: #10b981;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .selector-label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .team-selector-wrapper {
            position: relative;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 0.75rem 1rem;

            align-items: center;
            gap: 0.75rem;

            -moz-appearance: none;
            appearance: none;

        }

        .select-arrow {

            right: 1rem;

            border-t: 5px solid var(--text-muted);

        .telemetry-grid {

            grid-template-columns: 1fr;

    <!-- Realtime Telemetry Sync Logic -->
    <script>
        // Formatter for lap times (secs -> m:ss.ms)
        function formatLapTime(secs) {
            if (!secs || secs <= 0) return "--:--.---";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            const milliseconds = Math.floor((secs % 1) * 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
        }

        // Init Lucide Icons
        lucide.createIcons();

        // Target references
        const teamSelect = document.getElementById('team-select');
        const telemetryContent = document.getElementById('telemetry-content');
        
        let streamsRef = null;
        let driversRef = null;

        // Start listening to Firebase database events
        function setupFirebaseListeners(teamId) {
            // Unsubscribe existing listeners if any
            if (streamsRef) streamsRef.off();
            if (driversRef) driversRef.off();

            // Establish Firebase App DB instance pointing to correct European endpoint
            const database = firebase.app().database("https://grid-up-racedash-default-rtdb.europe-west1.firebasedatabase.app");
            streamsRef = database.ref(`teams/${teamId}/streams`);
            driversRef = database.ref(`teams/${teamId}/drivers`);

            let currentStreams = {};
            let currentDrivers = {};

            // Render updates helper
            function renderDashboard() {
                const activeMids = Object.keys(currentStreams).filter(mid => currentStreams[mid] && currentStreams[mid].is_live);
                
                if (activeMids.length === 0) {
                    telemetryContent.innerHTML = `
                        <div class="empty-wrapper">
                            <i data-lucide="activity" class="empty-icon" style="width: 48px; height: 48px;"></i>
                            <div class="empty-title">No Active Streams</div>
                            <div class="empty-desc">No drivers are currently streaming telemetry on team "${teamId}". Run the recorder client and drive in iRacing to go live!</div>
                        </div>
                    `;
                    lucide.createIcons();
                    return;
                }

                let cardsHtml = '<div class="telemetry-grid">';
                activeMids.forEach(mid => {
                    const streamData = currentStreams[mid];
                    const tel = streamData.telemetry || {};
                    const session = streamData.session || {};
                    const presence = currentDrivers[mid] || {};
                    const driverName = presence.name || tel.drivers?.[tel.playerIdx]?.name || "Active Driver";

                    const speedKmh = Math.round((tel.speed || 0) * 3.6);
                    const gearText = tel.gear === 0 ? "N" : tel.gear === -1 ? "R" : tel.gear;
                    const progressPct = Math.min(Math.max((tel.progress || 0) * 100, 0), 100);

                    // Pedals
                    const throttleVal = tel.throttle || 0;
                    const brakeVal = tel.brake || 0;

                    // Tyres
                    const tyres = tel.health?.tyres || {};
                    const lf = tyres.LF || {};
                    const rf = tyres.RF || {};
                    const lr = tyres.LR || {};
                    const rr = tyres.RR || {};

                    // Build Standings Rows
                    let standingsRows = '';
                    if (tel.drivers) {
                        const sortedDrivers = Object.values(tel.drivers)
                            .filter(d => d && d.pos > 0)
                            .sort((a, b) => a.pos - b.pos);
                        
                        sortedDrivers.forEach(d => {
                            const isPlayerRow = d.isPlayer ? 'class="standings-row-player"' : '';
                            const classIndicator = d.classColor ? `<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#${d.classColor}; margin-right:4px;"></span>` : '';
                            
                            standingsRows += `
                                <tr ${isPlayerRow}>
                                    <td style="text-align: center; font-weight: bold;">${d.classPos || d.pos}</td>
                                    <td><span class="car-num-tag">${d.carNum}</span></td>
                                    <td><div style="display:flex; align-items:center; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${classIndicator}${d.name}</div></td>
                                    <td style="text-align: center;">${d.lap || 0}</td>
                                    <td style="text-align: right;" class="laptime-mono">${formatLapTime(d.lastLap)}</td>
                                    <td style="text-align: right; color:#f3f4f6;" class="laptime-mono">${formatLapTime(d.bestLap)}</td>
                                </tr>
                            `;
                        });
                    }
                    if (!standingsRows) {
                        standingsRows = '<tr><td colspan="6" style="text-align:center; padding:1rem; color:var(--text-muted);">No standings data available</td></tr>';
                    }

                    cardsHtml += `
                        <div class="driver-card">
                            <!-- Card Header -->
                            <div class="card-header">
                                <div class="driver-info-block">
                                    <div class="driver-avatar">
                                        <i data-lucide="user" style="width: 20px; height: 20px;"></i>
                                    </div>
                                    <div>
                                        <h3 class="driver-name">${driverName}</h3>
                                        <div class="driver-metadata">
                                            <span class="car-num-tag">Car #${presence.carNum || tel.carNum || "-"}</span>
                                            <span style="font-size: 0.65rem; color: #10b981; font-weight: bold; display: flex; align-items: center; gap: 4px;">
                                                <span class="live-dot" style="margin-right: 0;"></span> Live
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="session-info">
                                    <span class="session-sid">Session ID: ${session.sid || "N/A"}</span>
                                    <div class="session-track">
                                        <i data-lucide="map" style="width: 12px; height: 12px;"></i>
                                        <span>${session.trackName || "iRacing UI"}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Metrics Core -->
                            <div class="metrics-grid">
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="gauge" style="width: 12px; height: 12px;"></i> Speed</span>
                                    <div class="metric-val">${speedKmh}<span>km/h</span></div>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="zap" style="width: 12px; height: 12px;"></i> Gear</span>
                                    <div class="metric-val" style="color: #34d399;">${gearText} <span style="font-size: 0.65rem; font-weight: 500;">(${tel.rpm || 0} RPM)</span></div>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="droplet" style="width: 12px; height: 12px;"></i> Fuel</span>
                                    <div class="metric-val">${tel.fuel || 0}<span>L</span></div>
                                </div>
                                <div class="metric-card">
                                    <span class="metric-title"><i data-lucide="check-circle-2" style="width: 12px; height: 12px;"></i> Position</span>
                                    <div class="metric-val">${tel.position || "P-"}<span>Class</span></div>
                                </div>
                            </div>

                            <!-- Throttle / Brake Pedals -->
                            <div class="pedals-container">
                                <div class="pedal-bar-wrapper">
                                    <div class="pedal-label">
                                        <span>Throttle</span>
                                        <span style="color: #34d399;">${throttleVal}%</span>
                                    </div>
                                    <div class="pedal-bar-bg">
                                        <div class="pedal-bar-fill throttle-fill" style="width: ${throttleVal}%;"></div>
                                    </div>
                                </div>
                                <div class="pedal-bar-wrapper">
                                    <div class="pedal-label">
                                        <span>Brake</span>
                                        <span style="color: #f87171;">${brakeVal}%</span>
                                    </div>
                                    <div class="pedal-bar-bg">
                                        <div class="pedal-bar-fill brake-fill" style="width: ${brakeVal}%;"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Progression Bar -->
                            <div class="progression-container">
                                <div class="pedal-label">
                                    <span>Lap Progression</span>
                                    <span style="color: #60a5fa;">${Math.round(progressPct)}%</span>
                                </div>
                                <div class="progression-bar-bg">
                                    <div class="progression-bar-fill" style="width: ${progressPct}%;"></div>
                                </div>
                                <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); margin-top: 0.5rem; font-family: monospace;">
                                    <span>Start / Finish</span>
                                    <span>Lap ${tel.lap || 0}</span>
                                </div>
                            </div>

                            <!-- Tyre Temperatures and Pressures -->
                            <div class="tyre-container">
                                <h4 class="metric-title" style="margin-bottom: 0.75rem;">
                                    <i data-lucide="thermometer" style="width: 14px; height: 14px;"></i> Tyre Telemetry (Psi / Temp)
                                </h4>
                                <div class="tyre-grid">
                                    <div class="car-outline"></div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">LF</div>
                                        <div class="tyre-press">${lf.p || 0} psi</div>
                                        <div class="tyre-temp">${lf.t || 0} °C</div>
                                    </div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">RF</div>
                                        <div class="tyre-press">${rf.p || 0} psi</div>
                                        <div class="tyre-temp">${rf.t || 0} °C</div>
                                    </div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">LR</div>
                                        <div class="tyre-press">${lr.p || 0} psi</div>
                                        <div class="tyre-temp">${lr.t || 0} °C</div>
                                    </div>
                                    <div class="tyre-card">
                                        <div class="tyre-name">RR</div>
                                        <div class="tyre-press">${rr.p || 0} psi</div>
                                        <div class="tyre-temp">${rr.t || 0} °C</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Live Standings Table -->
                            <div class="standings-container">
                                <h4 class="metric-title" style="margin-bottom: 0.75rem;">
                                    <i data-lucide="list-ordered" style="width: 14px; height: 14px;"></i> Live Session Standings
                                </h4>
                                <div style="max-height: 250px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.03); border-radius: 12px; background: rgba(10,10,10,0.3);">
                                    <table class="standings-table">
                                        <thead>
                                            <tr>
                                                <th style="text-align: center; width: 40px;">Pos</th>
                                                <th style="width: 50px;">Car</th>
                                                <th>Driver</th>
                                                <th style="text-align: center; width: 40px;">Lap</th>
                                                <th style="text-align: right; width: 80px;">Last</th>
                                                <th style="text-align: right; width: 80px;">Best</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${standingsRows}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Footer Stats -->
                            <div class="card-footer">
                                <span>Refreshed: 60Hz</span>
                                <span style="display: flex; align-items: center; gap: 4px;">
                                    <i data-lucide="compass" style="width: 10px; height: 10px;"></i>
                                    <span>Track Temp: ${tel.track_temp || 0} °C</span>
                                </span>
                            </div>
                        </div>
                    `;
                });
                cardsHtml += '</div>';
                telemetryContent.innerHTML = cardsHtml;
                lucide.createIcons();
            }

            // Bind values
            streamsRef.on('value', snapshot => {
                currentStreams = snapshot.val() || {};
                renderDashboard();
            }, error => {
                console.error("Streams subscription failed:", error);
                telemetryContent.innerHTML = `
                    <div class="empty-wrapper">
                        <i data-lucide="alert-triangle" class="empty-icon" style="width: 48px; height: 48px; color: #ef4444;"></i>
                        <div class="empty-title" style="color: #ef4444;">Connection Error</div>
                        <div class="empty-desc">Failed to subscribe to streams: ${error.message}</div>
                    </div>
                `;
                lucide.createIcons();
            });

            driversRef.on('value', snapshot => {
                currentDrivers = snapshot.val() || {};
                renderDashboard();
            }, error => {
                console.error("Drivers subscription failed:", error);
            });
        }

        // Dropdown Event Listener
        teamSelect.addEventListener('change', (e) => {
            setupFirebaseListeners(e.target.value);
        });

        // Trigger on DOM Loaded
        document.addEventListener('DOMContentLoaded', () => {
            const dbCheckInterval = setInterval(() => {
                if (window.firebase && firebase.apps && firebase.apps.length > 0) {
                    clearInterval(dbCheckInterval);
                    setupFirebaseListeners(teamSelect.value);
                }
            }, 100);
        });
    </script>
</body>
</html>
