<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRiD UP | Overlay Renderer</title>
    <!-- Google Fonts same as website -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --secondary: #e11d48;
            --accent-gold: #eab308;
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden;
            font-family: var(--font-body);
            color: #fff;
        }

        .overlay-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }

        /* Widget Container base layout */
        .widget-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            transform-origin: center center;
            display: none; /* Shown if active */
        }

        /* --- THEMES STYLING SYSTEM --- */
        .widget-card {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* 1. Redline Premium Theme */
        .theme-redline .widget-card {
            background: rgba(10, 12, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--secondary);
            border-radius: 0 12px 12px 0;
        }
        .theme-redline.glow-on .widget-card {
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.22);
            border-color: rgba(225, 29, 72, 0.4);
        }
        .theme-redline .accent-text {
            color: var(--secondary);
        }

        /* 2. Glassmorphism Pro Theme */
        .theme-glass-pro .widget-card {
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }
        .theme-glass-pro.glow-on .widget-card {
            box-shadow: 0 8px 32px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .theme-glass-pro .accent-text {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
        }

        /* 3. Championship Gold Theme */
        .theme-gold .widget-card {
            background: linear-gradient(135deg, #0f0e0a 0%, #030302 100%);
            border: 1px solid rgba(234, 179, 8, 0.25);
            border-radius: 12px;
        }
        .theme-gold.glow-on .widget-card {
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.16);
            border-color: rgba(234, 179, 8, 0.45);
        }
        .theme-gold .accent-text {
            color: var(--accent-gold);
        }

        /* 4. Solid Dark Theme */
        .theme-dark .widget-card {
            background: #090a0f;
            border: 1px solid #1e293b;
            border-radius: 10px;
        }
        .theme-dark .accent-text {
            color: var(--primary);
        }

        /* 5. Stealth Theme */
        .theme-stealth .widget-card {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: none;
        }
        .theme-stealth .accent-text {
            color: #fff;
        }

        /* --- TELEMETRY HUD WIDGET --- */
        .hud-widget {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            min-width: 250px;
            height: 78px;
            padding: 0.85rem 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .hud-led-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.06);
            display: none; /* Shown for Redline theme */
        }

        .theme-redline .hud-led-bar {
            display: block;
        }

        .hud-led-fill {
            height: 100%;
            width: 0%;
            background: #10b981;
            transition: width 0.05s ease, background-color 0.1s ease;
        }

        .hud-gear-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 1.25rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-gear-label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            font-family: var(--font-heading);
            margin-bottom: 2px;
        }

        .hud-gear-value {
            font-size: 2.25rem;
            font-weight: 900;
            line-height: 1;
            font-family: var(--font-heading);
        }

        .hud-speed-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-speed-value {
            font-size: 1.75rem;
            font-weight: 900;
            line-height: 1;
            font-family: var(--font-heading);
            letter-spacing: -0.5px;
        }

        .hud-speed-unit {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 4px;
        }

        /* SVG Steering wheel design */
        .hud-steering-icon {
            width: 24px;
            height: 24px;
            transform-origin: center center;
            transition: transform 0.05s ease;
        }

        .hud-steering-icon path {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .hud-pedals {
            display: flex;
            gap: 8px;
            height: 100%;
            align-items: flex-end;
        }

        .pedal-gauge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            height: 100%;
        }

        .pedal-label {
            font-size: 0.45rem;
            font-family: var(--font-heading);
            color: rgba(255, 255, 255, 0.4);
        }

        .pedal-bar-bg {
            width: 9px;
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .pedal-bar-fill {
            width: 100%;
            height: 0%;
            border-radius: 1px;
            transition: height 0.05s ease;
        }

        .pedal-bar-throttle {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .pedal-bar-brake {
            background: var(--secondary);
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.3);
        }

        /* --- RELATIVE WIDGET --- */
        .relative-widget {
            padding: 0.85rem 1.15rem;
            min-width: 210px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .widget-header {
            font-size: 0.55rem;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 4px;
            margin-bottom: 2px;
        }

        .relative-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-heading);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .relative-row.driver-focused {
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid rgba(225, 29, 72, 0.25);
            padding: 3px 6px;
            border-radius: 4px;
            color: #fff;
        }

        .relative-gap {
            font-weight: 900;
        }

        .gap-ahead {
            color: #0ea5e9;
        }

        .gap-behind {
            color: #10b981;
        }

        .gap-focused {
            color: var(--secondary);
        }

        /* --- LEADERBOARD WIDGET --- */
        .leaderboard-widget {
            padding: 0.85rem 1.15rem;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            font-family: var(--font-heading);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
        }

        .leaderboard-time {
            color: rgba(255, 255, 255, 0.6);
        }

        /* --- SESSION WIDGET --- */
        .session-widget {
            padding: 0.75rem 1.15rem;
            min-width: 260px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .session-info-left, .session-info-right {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .session-info-label {
            font-size: 0.5rem;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
        }

        .session-info-value {
            font-size: 0.75rem;
            font-weight: 800;
            font-family: var(--font-heading);
        }

        .session-flag-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 4px;
            padding: 4px 10px;
        }

        .session-flag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-flag 1.5s infinite;
        }

        .session-flag-text {
            font-family: var(--font-heading);
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #10b981;
        }

        @keyframes pulse-flag {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* --- ROTATOR WIDGET --- */
        .rotator-widget {
            padding: 0.75rem 1.15rem;
            min-width: 190px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rotator-content {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-heading);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .rotator-badge {
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid rgba(225, 29, 72, 0.25);
            color: var(--secondary);
            text-transform: uppercase;
        }

        .rotator-text {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="overlay-canvas" id="main-canvas">
        <!-- Telemetry HUD Widget Container -->
        <div id="widget-hud" class="widget-wrapper">
            <div class="widget-card">
                <div class="hud-widget">
                    <!-- RPM / LED light indicator -->
                    <div class="hud-led-bar">
                        <div class="hud-led-fill" id="hud-led-fill"></div>
                    </div>
                    
                    <!-- Gear -->
                    <div class="hud-gear-container">
                        <span class="hud-gear-label">Gear</span>
                        <span class="hud-gear-value accent-text" id="hud-gear-value">N</span>
                    </div>

                    <!-- Speed & Steering -->
                    <div class="hud-speed-container">
                        <div>
                            <span class="hud-speed-value" id="hud-speed-value">0</span>
                            <span class="hud-speed-unit" id="hud-speed-unit">MPH</span>
                        </div>
                        
                        <!-- Steering angle line representation -->
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <svg class="hud-steering-icon" id="hud-steering-wheel" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>
                                <path d="M 4 12 L 20 12" />
                                <path d="M 12 4 L 12 12" />
                                <circle cx="12" cy="12" r="2" fill="currentColor"/>
                            </svg>
                            <span style="font-size: 0.5rem; text-transform: uppercase; color: rgba(255,255,255,0.3); font-family: var(--font-heading); font-weight: bold;">Steer</span>
                        </div>
                    </div>

                    <!-- Pedals gauges -->
                    <div class="hud-pedals">
                        <!-- Throttle -->
                        <div class="pedal-gauge">
                            <span class="pedal-label">T</span>
                            <div class="pedal-bar-bg">
                                <div class="pedal-bar-fill pedal-bar-throttle" id="hud-throttle-bar"></div>
                            </div>
                        </div>
                        <!-- Brake -->
                        <div class="pedal-gauge">
                            <span class="pedal-label">B</span>
                            <div class="pedal-bar-bg">
                                <div class="pedal-bar-fill pedal-bar-brake" id="hud-brake-bar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Relative Standing Widget Container -->
        <div id="widget-relative" class="widget-wrapper">
            <div class="widget-card">
                <div class="relative-widget">
                    <div class="widget-header">Relative Standings</div>
                    
                    <div class="relative-row">
                        <span id="relative-ahead-name">P2 L. Hamilton</span>
                        <span class="relative-gap gap-ahead" id="relative-ahead-gap">+1.45s</span>
                    </div>
                    
                    <div class="relative-row driver-focused">
                        <span id="relative-focused-name">P3 Guest Driver</span>
                        <span class="relative-gap gap-focused">--</span>
                    </div>

                    <div class="relative-row">
                        <span id="relative-behind-name">P4 M. Verstappen</span>
                        <span class="relative-gap gap-behind" id="relative-behind-gap">-0.85s</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leaderboard Widget Container -->
        <div id="widget-leaderboard" class="widget-wrapper">
            <div class="widget-card">
                <div class="leaderboard-widget">
                    <div class="widget-header">Race Standings</div>
                    <div class="leaderboard-row">
                        <span>1. M. Verstappen</span>
                        <span class="leaderboard-time">1:46.381</span>
                    </div>
                    <div class="leaderboard-row">
                        <span>2. L. Norris</span>
                        <span class="leaderboard-time">+1.482s</span>
                    </div>
                    <div class="leaderboard-row">
                        <span>3. O. Piastri</span>
                        <span class="leaderboard-time">+2.845s</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Session Status Widget Container -->
        <div id="widget-session" class="widget-wrapper">
            <div class="widget-card">
                <div class="session-widget">
                    <div class="session-info-left">
                        <span class="session-info-label">Session</span>
                        <span class="session-info-value accent-text" id="session-info-laps">RACE · LAP 1/25</span>
                    </div>

                    <div class="session-flag-container">
                        <span class="session-flag-dot"></span>
                        <span class="session-flag-text">GREEN</span>
                    </div>

                    <div class="session-info-right" style="text-align: right;">
                        <span class="session-info-label">Track Temp</span>
                        <span class="session-info-value" id="session-info-temp">34.2 °C</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sponsor / Social Rotator Container -->
        <div id="widget-rotator" class="widget-wrapper">
            <div class="widget-card">
                <div class="rotator-widget">
                    <div class="rotator-content" id="rotator-content-wrapper">
                        <span class="rotator-badge" id="rotator-badge-el">🌐 discord</span>
                        <span class="rotator-text" id="rotator-text-el">JOIN DISCORD</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vanilla Javascript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Parse parameters
            const params = new URLSearchParams(window.location.search);

            const activeWidgets = (params.get("active") || "hud,relative,session").split(",");
            const theme = params.get("theme") || "redline";
            const glow = params.get("glow") !== "false";
            const speedUnit = params.get("unit") || "imperial";
            const forceSim = params.get("sim") === "true";
            const rotatorInterval = parseInt(params.get("rotatorInterval") || "6", 10) * 1000;
            const rotatorBadge = params.get("rotatorBadge") !== "false";

            // Apply Theme to Canvas Container
            const canvasEl = document.getElementById("main-canvas");
            canvasEl.className = `overlay-canvas theme-${theme} ${glow ? 'glow-on' : ''}`;

            // Widget Positioning & Scale Configuration Helper
            function setupWidget(id, defaultX, defaultY, defaultScale) {
                const wrapper = document.getElementById(`widget-${id}`);
                if (!wrapper) return;

                if (activeWidgets.includes(id)) {
                    wrapper.style.display = "block";
                    
                    const x = params.get(`${id}_x`) || defaultX;
                    const y = params.get(`${id}_y`) || defaultY;
                    const s = params.get(`${id}_s`) || defaultScale;

                    wrapper.style.left = `${x}%`;
                    wrapper.style.top = `${y}%`;
                    wrapper.style.transform = `translate(-50%, -50%) scale(${s})`;
                } else {
                    wrapper.style.display = "none";
                }
            }

            // Load and position active widgets
            setupWidget("hud", 50, 85, 1.0);
            setupWidget("relative", 15, 80, 0.95);
            setupWidget("leaderboard", 15, 25, 0.9);
            setupWidget("session", 50, 12, 0.9);
            setupWidget("rotator", 85, 85, 1.0);

            // Rotator sliding list items
            const rotatorItems = [
                { id: "discord", label: "JOIN DISCORD", icon: "🌐" },
                { id: "website", label: "VISIT WEBSITE", icon: "💻" },
                { id: "subscribe", label: "SUBSCRIBE FOR COACHING", icon: "🏎️" }
            ];

            let rotatorIndex = 0;
            const rotatorBadgeEl = document.getElementById("rotator-badge-el");
            const rotatorTextEl = document.getElementById("rotator-text-el");
            const rotatorContentEl = document.getElementById("rotator-content-wrapper");

            if (activeWidgets.includes("rotator")) {
                // Initialize badge visibility
                if (!rotatorBadge) {
                    rotatorBadgeEl.style.display = "none";
                }

                // Rotator interval loop
                setInterval(() => {
                    rotatorContentEl.style.opacity = "0";
                    rotatorContentEl.style.transform = "translateY(5px)";
                    
                    setTimeout(() => {
                        rotatorIndex = (rotatorIndex + 1) % rotatorItems.length;
                        const item = rotatorItems[rotatorIndex];
                        
                        rotatorBadgeEl.textContent = `${item.icon} ${item.id}`;
                        rotatorTextEl.textContent = item.label;
                        
                        rotatorContentEl.style.opacity = "1";
                        rotatorContentEl.style.transform = "translateY(0)";
                    }, 300);
                }, rotatorInterval);
            }

            // Real-Time Telemetry Data Fields
            let telemetry = {
                speed: 0,
                gear: 0,
                throttle: 0,
                brake: 0,
                steeringAngle: 0,
                lapDist: 0,
                active: false,
                trackName: "Unknown",
                carName: "Unknown",
                driverName: "Guest Driver",
                lapNumber: 1
            };

            // High-fidelity Telemetry Simulation Parameters
            let simProgress = 0;

            function runSimulation() {
                simProgress = (simProgress + 0.35) % 100;
                const sim = getSimulatedTelemetry(simProgress);
                
                telemetry = {
                    speed: sim.speed,
                    gear: sim.gear,
                    throttle: sim.throttle,
                    brake: sim.brake,
                    steeringAngle: sim.steeringAngle,
                    lapDist: sim.lapDist,
                    active: true,
                    trackName: "Spa-Francorchamps",
                    carName: "Porsche 911 GT3",
                    driverName: "Guest Driver",
                    lapNumber: 4
                };
                
                updateUI();
            }

            // Sim Spa-Francorchamps Circuit corners
            function getSimulatedTelemetry(progress) {
                let throttle = 1.0;
                let brake = 0.0;
                let gear = 5;
                let steeringAngle = 0.0;
                let speed = 55.0; // m/s (≈123 mph)

                if (progress >= 10 && progress < 18) {
                    // La Source hairpin
                    const t = (progress - 10) / 8;
                    brake = Math.sin(t * Math.PI) * 0.95;
                    throttle = t > 0.85 ? (t - 0.85) / 0.15 : 0.0;
                    gear = t < 0.45 ? 5 - Math.floor(t * 4) : 1;
                    speed = 70.0 - t * 52.0;
                    steeringAngle = t > 0.35 ? Math.sin((t - 0.35) / 0.65 * Math.PI) * 1.2 : 0.0;
                } else if (progress >= 18 && progress < 35) {
                    // Acceleration
                    const t = (progress - 18) / 17;
                    throttle = 1.0;
                    brake = 0.0;
                    gear = 1 + Math.floor(t * 4);
                    speed = 18.0 + t * 50.0;
                    steeringAngle = t < 0.2 ? (0.2 - t) * 0.4 : 0.0;
                } else if (progress >= 35 && progress < 42) {
                    // Eau Rouge & Raidillon
                    const t = (progress - 35) / 7;
                    throttle = 0.85 - Math.sin(t * Math.PI) * 0.15;
                    brake = 0.0;
                    gear = 5;
                    speed = 68.0 - t * 4.0;
                    steeringAngle = Math.sin(t * Math.PI * 2) * 0.35;
                } else if (progress >= 42 && progress < 60) {
                    // Kemmel Straight flat out
                    const t = (progress - 42) / 18;
                    throttle = 1.0;
                    brake = 0.0;
                    gear = 5 + Math.floor(t * 2);
                    speed = 64.0 + t * 21.0;
                    steeringAngle = 0.0;
                } else if (progress >= 60 && progress < 68) {
                    // Les Combes Chicane
                    const t = (progress - 60) / 8;
                    brake = Math.sin(t * Math.PI) * 0.8;
                    throttle = 0.0;
                    gear = t < 0.5 ? 7 - Math.floor(t * 4) : 3;
                    speed = 85.0 - t * 48.0;
                    steeringAngle = t > 0.25 ? -Math.sin((t - 0.25) / 0.75 * Math.PI) * 0.6 : 0.0;
                } else {
                    // Out-sector
                    const t = progress >= 68 ? (progress - 68) / 32 : (progress + 32) / 32;
                    throttle = 0.9;
                    brake = 0.0;
                    gear = 4;
                    speed = 40.0 + t * 15.0;
                    steeringAngle = 0.0;
                }

                return { speed, gear, throttle, brake, steeringAngle, lapDist: progress * 70.04 };
            }

            // Real-Time Poller to Telemetry Bridge
            async function pollTelemetry() {
                try {
                    const response = await fetch("http://localhost:3000/api/bridge/live_state");
                    if (!response.ok) throw new Error("Offline");
                    const data = await response.json();

                    if (data.active && !forceSim) {
                        const frames = data.newFrames || [];
                        if (frames.length > 0) {
                            const lastFrame = frames[frames.length - 1];
                            telemetry = {
                                speed: lastFrame.speed || 0,
                                gear: lastFrame.gear || 0,
                                throttle: lastFrame.throttle || 0,
                                brake: lastFrame.brake || 0,
                                steeringAngle: lastFrame.steeringAngle || 0,
                                lapDist: lastFrame.lapDist || 0,
                                active: true,
                                trackName: data.trackName || "iRacing Circuit",
                                carName: data.carName || "Race Car",
                                driverName: data.driverName || "Driver",
                                lapNumber: data.lapNumber || 1
                            };
                        } else {
                            telemetry.active = false;
                        }
                        updateUI();
                    } else {
                        runSimulation();
                    }
                } catch (e) {
                    runSimulation();
                }
            }

            // Update DOM Elements based on telemetry state
            function updateUI() {
                // 1. Update Telemetry HUD
                if (activeWidgets.includes("hud")) {
                    const speedUnitText = speedUnit === "imperial" ? "MPH" : "KM/H";
                    const multiplier = speedUnit === "imperial" ? 2.23694 : 3.6;
                    const displaySpeed = (telemetry.speed * multiplier).toFixed(0);

                    document.getElementById("hud-speed-value").textContent = displaySpeed;
                    document.getElementById("hud-speed-unit").textContent = speedUnitText;
                    
                    const gearValue = telemetry.gear === 0 ? "N" : telemetry.gear === -1 ? "R" : telemetry.gear;
                    document.getElementById("hud-gear-value").textContent = gearValue;

                    // Rotator steering icon wheel line
                    const deg = (telemetry.steeringAngle * 180 / Math.PI);
                    document.getElementById("hud-steering-wheel").style.transform = `rotate(${deg}deg)`;

                    // Pedals
                    document.getElementById("hud-throttle-bar").style.height = `${telemetry.throttle * 100}%`;
                    document.getElementById("hud-brake-bar").style.height = `${telemetry.brake * 100}%`;

                    // Tachometer Redline LED (Approximate RPM based on speed within gear limit)
                    const gearSpeeds = [0, 25, 40, 58, 72, 85, 98, 115];
                    const limit = gearSpeeds[telemetry.gear] || 85;
                    const start = limit * 0.45;
                    const rpmPct = Math.max(0, Math.min(100, ((telemetry.speed - start) / (limit - start)) * 100));
                    
                    const ledFill = document.getElementById("hud-led-fill");
                    ledFill.style.width = `${rpmPct}%`;
                    if (rpmPct > 90) {
                        ledFill.style.backgroundColor = "var(--secondary)";
                    } else if (rpmPct > 70) {
                        ledFill.style.backgroundColor = "var(--accent-gold)";
                    } else {
                        ledFill.style.backgroundColor = "#10b981";
                    }
                }

                // 2. Update Relative Standings Gaps
                if (activeWidgets.includes("relative")) {
                    const timeSeed = Date.now() / 3000;
                    const gapAhead = Math.max(0.1, 1.45 + Math.sin(timeSeed) * 0.4).toFixed(2);
                    const gapBehind = Math.max(0.1, 0.85 - Math.sin(timeSeed) * 0.2).toFixed(2);

                    document.getElementById("relative-focused-name").textContent = `P3 ${telemetry.driverName}`;
                    document.getElementById("relative-ahead-gap").textContent = `+${gapAhead}s`;
                    document.getElementById("relative-behind-gap").textContent = `-${gapBehind}s`;
                }

                // 3. Update Session Info
                if (activeWidgets.includes("session")) {
                    document.getElementById("session-info-laps").textContent = `RACE · LAP ${telemetry.lapNumber}/25`;
                }
            }

            // Established polling loop at 100ms
            setInterval(pollTelemetry, 100);
        });
    </script>
</body>
</html>
