        function log(msg, cls = 'ok') {
            document.getElementById('log').innerHTML += `<span class="${cls}">${msg}\n</span>`;
        }

        async function applyExactUpdates() {
            if (typeof db === 'undefined') {
                log('ERROR: Firestore not initialized. Wait a moment and try again.', 'err');
                return;
            }
            document.getElementById('log').innerHTML = '';
            log(`Fetching Virginia 120 results from Firestore...`, 'info');

            try {
                const snap = await db.collection('event_results')
                    .where('eventId', '==', EVENT_ID)
                    .get();

                if (snap.empty) {
                    log('No results found for gtc-virginia-120. Have you seeded the results?', 'err');
                    return;
                }

                log(`Found ${snap.size} documents. Applying exact iRacing updates...\n`, 'info');

                let updated = 0, skipped = 0;
                for (const doc of snap.docs) {
                    const data = doc.data();
                    const team = data.teamName || '';
                    const updates = EXACT_DATA[team];

                    if (updates !== undefined) {
                        await doc.ref.update(updates);
                        log(`✅ Updated ${team.padEnd(28)} → Qualy: ${updates.qualy.padEnd(4)} (${updates.qualyTime.padEnd(8)}) | Best Lap: ${updates.fastestLap.padEnd(8)} | Incidents: ${updates.incidents}x | Finish: ${updates.finish}`);
                        updated++;
                    } else {
                        log(`⚠️  No exact match in config: "${team}"`, 'err');
                        skipped++;
                    }
                }

                log(`\n─────────────────────────────────────────`);
                log(`Done! ${updated} updated, ${skipped} skipped.`);
                log(`\nYour standings page will now display 100% accurate start/fastest times and DNF points!`, 'info');

            } catch (e) {
                log(`ERROR: ${e.message}`, 'err');
            }
        }
