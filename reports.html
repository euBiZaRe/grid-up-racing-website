    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const feed = document.getElementById('reports-feed');
        if (!feed) return;

        // Wait for Firebase db from script.js
        let attempts = 0;
        while (typeof db === 'undefined' && attempts < 20) {
            await new Promise(r => setTimeout(r, 200));
            attempts++;
        }
        if (typeof db === 'undefined') {
            feed.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:3rem;"><p>Could not load reports. Please try again later.</p></div>';
            return;
        }

        try {
            const snap = await db.collection('reports').orderBy('date', 'desc').get();
            if (snap.empty) {
                feed.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:3rem;"><p>No race reports yet. Check back after our next event!</p></div>';
                return;
            }
            feed.innerHTML = '';
            snap.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                const slug = data.slug || id;
                const rawDate = data.date && data.date.toDate ? data.date.toDate() : new Date();
                const dateStr = rawDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                const banner = data.bannerUrl || 'assets/bg-banner.png';

                const card = document.createElement('div');
                card.className = 'glass';
                card.style.cssText = 'border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.23,1,0.32,1), box-shadow 0.4s ease; cursor: pointer; border: 1px solid var(--glass-border);';
                card.onmouseover = () => { card.style.transform = 'translateY(-8px)'; card.style.boxShadow = '0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0,207,255,0.15)'; card.style.borderColor = 'rgba(0,207,255,0.4)'; };
                card.onmouseout = () => { card.style.transform = ''; card.style.boxShadow = ''; card.style.borderColor = 'var(--glass-border)'; };
                card.onclick = () => window.location.href = `report-detail.html?id=${slug}`;

                card.innerHTML = `
                    <div style="height: 200px; overflow: hidden; position: relative;">
                        <img src="${banner}" alt="${data.title}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease;" onerror="this.src='assets/bg-banner.png'">
                        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,12,16,0.9) 0%, transparent 60%);"></div>
                    </div>
                    <div style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
                        <p style="color: var(--primary); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem;">${dateStr}</p>
                        <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem; font-family: var(--font-heading); letter-spacing: 0.05em;">${data.title}</h3>
                        <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; flex: 1;">${data.summary || ''}</p>
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--glass-border);">
                            <span style="font-size: 0.75rem; color: var(--text-muted);">By ${data.author || 'GRiD UP'}</span>
                            <span style="font-size: 0.75rem; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Read Report ?</span>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        } catch (e) {
            console.error('Error loading reports:', e);
            feed.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ff3333;padding:3rem;"><p>Error loading reports.</p></div>';
        }
    });
    </script>
