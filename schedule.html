    <style>
        .schedule-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 3rem;
            align-items: center;
            justify-content: space-between;
        }

        .category-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition-fast);
            outline: none;
        }

        .category-btn:hover {
            background: rgba(0, 207, 255, 0.1);
            color: var(--primary);
            border-color: var(--primary);
        }

        .category-btn.active {
            background: var(--primary-gradient);
            color: #000;
            border: 1px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .search-week-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .schedule-search {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            color: var(--text-main);
            font-family: inherit;
            width: 250px;
            transition: var(--transition-fast);
        }

        .schedule-search:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .week-select-dropdown {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.6rem 2.5rem 0.6rem 1.2rem;
            color: #fff;
            font-family: inherit;
            cursor: pointer;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .series-card {
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            background: rgba(20, 20, 22, 0.5);
            backdrop-filter: blur(10px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .series-card:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 207, 255, 0.05);
            transform: translateY(-4px);
        }

        .series-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .series-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .license-lbl {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .license-lbl.rookie { background: rgba(188, 188, 188, 0.1); color: #9ca3af; border: 1px solid rgba(188, 188, 188, 0.2); }
        .license-lbl.class-d { background: rgba(252, 106, 3, 0.2); color: #fb923c; border: 1px solid rgba(252, 106, 3, 0.4); }
        .license-lbl.class-c { background: rgba(247, 209, 23, 0.2); color: #facc15; border: 1px solid rgba(247, 209, 23, 0.4); }
        .license-lbl.class-b { background: rgba(0, 143, 31, 0.2); color: #4ade80; border: 1px solid rgba(0, 143, 31, 0.4); }
        .license-lbl.class-a { background: rgba(0, 66, 209, 0.2); color: #4DA3FF; border: 1px solid rgba(0, 66, 209, 0.4); }

        .cars-list {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .current-track-block {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .current-track-lbl {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .current-track-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        .expand-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            font-size: 0.8rem;
            font-weight: 600;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: color 0.2s;
        }

        .expand-btn:hover {
            color: var(--primary);
        }

        .full-schedule-drawer {
            display: none;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-height: 250px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .full-schedule-drawer::-webkit-scrollbar {
            width: 4px;
        }
        .full-schedule-drawer::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .week-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .week-row.active-week {
            color: var(--primary);
            font-weight: 700;
        }

        .license-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.5rem;
            width: 100%;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .license-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-family: var(--font-heading);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition-fast);
            outline: none;
        }

        .license-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }

        .license-btn.active[data-license="all"] {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
            color: #fff;
        }
        .license-btn.active[data-license="Rookie"] {
            background: rgba(188, 188, 188, 0.15);
            color: #fff;
            border-color: #9ca3af;
            box-shadow: 0 0 10px rgba(188, 188, 188, 0.15);
        }
        .license-btn.active[data-license="Class D"] {
            background: rgba(252, 106, 3, 0.2);
            color: #fff;
            border-color: #fb923c;
            box-shadow: 0 0 10px rgba(252, 106, 3, 0.2);
        }
        .license-btn.active[data-license="Class C"] {
            background: rgba(247, 209, 23, 0.2);
            color: #fff;
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(247, 209, 23, 0.2);
        }
        .license-btn.active[data-license="Class B"] {
            background: rgba(0, 143, 31, 0.2);
            color: #fff;
            border-color: #4ade80;
            box-shadow: 0 0 10px rgba(0, 143, 31, 0.2);
        }
        .license-btn.active[data-license="Class A"] {
            background: rgba(0, 66, 209, 0.2);
            color: #fff;
            border-color: #4DA3FF;
            box-shadow: 0 0 10px rgba(0, 66, 209, 0.2);
        }
    </style>

    <script>
        let allSchedules = [];
        let activeCategories = ["Oval", "Sports Car", "Formula", "Dirt Oval", "Dirt Road"];
        let activeLicenses = ["Rookie", "Class D", "Class C", "Class B", "Class A"];
        let activeWeek = 2; // Default to Week 2 (Current)

        document.addEventListener('DOMContentLoaded', () => {
            // Fetch the parsed schedule JSON
            fetch('scripts/iracing_schedule.json')
                .then(res => res.json())
                .then(data => {
                    allSchedules = data;
                    renderSchedule();
                })
                .catch(err => {
                    console.error("Error loading schedule data:", err);
                    document.getElementById('schedule-grid').innerHTML = '<p style="text-align: center; color: var(--secondary); grid-column: 1/-1;">Could not load schedule database.</p>';
                });
        });

        function toggleCategory(cat) {
            const index = activeCategories.indexOf(cat);
            if (index > -1) {
                activeCategories.splice(index, 1);
            } else {
                activeCategories.push(cat);
            }
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                const btnCat = btn.getAttribute('data-category');
                btn.classList.toggle('active', activeCategories.includes(btnCat));
            });
            renderSchedule();
        }

        function toggleLicense(lic) {
            const allLicenses = ["Rookie", "Class D", "Class C", "Class B", "Class A"];
            if (lic === 'all') {
                if (activeLicenses.length === allLicenses.length) {
                    activeLicenses = [];
                } else {
                    activeLicenses = [...allLicenses];
                }
            } else {
                const index = activeLicenses.indexOf(lic);
                if (index > -1) {
                    activeLicenses.splice(index, 1);
                } else {
                    activeLicenses.push(lic);
                }
            }
            
            document.querySelectorAll('.license-btn').forEach(btn => {
                const btnLic = btn.getAttribute('data-license');
                if (btnLic === 'all') {
                    btn.classList.toggle('active', activeLicenses.length === allLicenses.length);
                } else {
                    btn.classList.toggle('active', activeLicenses.includes(btnLic));
                }
            });
            renderSchedule();
        }

        function changeWeek(week) {
            activeWeek = parseInt(week);
            renderSchedule();
        }

        function getLicenseClass(lic) {
            const l = String(lic).toLowerCase();
            if (l.includes('class b (4.0)')) return 'class-a';
            if (l.includes('rookie')) return 'rookie';
            if (l.includes('class d')) return 'class-d';
            if (l.includes('class c')) return 'class-c';
            if (l.includes('class b')) return 'class-b';
            if (l.includes('class a')) return 'class-a';
            return 'rookie';
        }

        function getLicenseLabel(lic) {
            const l = String(lic).toLowerCase();
            if (l.includes('class b (4.0)')) return 'Class A';
            return lic;
        }

        function filterSchedule() {
            renderSchedule();
        }

        function toggleDrawer(id) {
            const drawer = document.getElementById(`drawer-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            if (!drawer || !btn) return;
            
            const isHidden = window.getComputedStyle(drawer).display === 'none';
            drawer.style.display = isHidden ? 'block' : 'none';
            btn.innerHTML = isHidden 
                ? 'Hide Season Schedule <span>▲</span>' 
                : 'Show Season Schedule <span>▼</span>';
        }

        function renderSchedule() {
            const grid = document.getElementById('schedule-grid');
            if (!grid) return;

            const searchQuery = document.getElementById('schedule-search-input').value.toLowerCase().trim();

            // Filter data
            const filtered = allSchedules.filter(item => {
                const matchesCat = activeCategories.includes(item.category);
                const itemLicClass = getLicenseClass(item.license);
                const matchesLicense = activeLicenses.some(lic => getLicenseClass(lic) === itemLicClass);
                const matchesSearch = !searchQuery || 
                                     item.seriesName.toLowerCase().includes(searchQuery) || 
                                     item.cars.toLowerCase().includes(searchQuery);
                return matchesCat && matchesLicense && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); grid-column: 1/-1; padding: 4rem;">No matching series found.</p>';
                return;
            }

            grid.innerHTML = '';
            filtered.forEach((item, index) => {
                // Find active week track
                const activeWeekData = item.schedule.find(w => w.week === activeWeek) || { track: "Off Week" };
                const licenseClass = getLicenseClass(item.license);

                // Build weeks list for drawer
                let weeksHtml = '';
                item.schedule.forEach(w => {
                    const isActive = w.week === activeWeek;
                    weeksHtml += `
                        <div class="week-row ${isActive ? 'active-week' : ''}">
                            <span>Week ${w.week}</span>
                            <span>${w.track}</span>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'series-card';
                card.innerHTML = `
                    <div>
                        <div class="series-header">
                            <span class="series-name">${item.seriesName}</span>
                            <span class="license-lbl ${licenseClass}">${getLicenseLabel(item.license)}</span>
                        </div>
                        <div class="cars-list">${item.cars}</div>
                        <div class="current-track-block">
                            <div class="current-track-lbl">Week ${activeWeek} Track</div>
                            <div class="current-track-name">${activeWeekData.track}</div>
                        </div>
                    </div>
                    <div>
                        <button id="btn-${index}" class="expand-btn" onclick="toggleDrawer(${index})">
                            Show Season Schedule <span>▼</span>
                        </button>
                        <div id="drawer-${index}" class="full-schedule-drawer">
                            ${weeksHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
