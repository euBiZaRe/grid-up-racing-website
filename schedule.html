    <style>
        .schedule-controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 3rem;
            background: rgba(20, 20, 22, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-family: var(--font-heading);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: var(--font-heading);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition-fast);
            outline: none;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* Specific license colors when active */
        .filter-btn.active[data-license="Rookie"] {
            background: rgba(188, 188, 188, 0.15);
            color: #fff;
            border-color: #9ca3af;
            box-shadow: 0 0 10px rgba(188, 188, 188, 0.15);
        }
        .filter-btn.active[data-license="Class D"] {
            background: rgba(252, 106, 3, 0.2);
            color: #fff;
            border-color: #fb923c;
            box-shadow: 0 0 10px rgba(252, 106, 3, 0.2);
        }
        .filter-btn.active[data-license="Class C"] {
            background: rgba(247, 209, 23, 0.2);
            color: #fff;
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(247, 209, 23, 0.2);
        }
        .filter-btn.active[data-license="Class B"] {
            background: rgba(0, 143, 31, 0.2);
            color: #fff;
            border-color: #4ade80;
            box-shadow: 0 0 10px rgba(0, 143, 31, 0.2);
        }
        .filter-btn.active[data-license="Class A"] {
            background: rgba(0, 66, 209, 0.2);
            color: #fff;
            border-color: #4DA3FF;
            box-shadow: 0 0 10px rgba(0, 66, 209, 0.2);
        }

        .schedule-search {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            width: 280px;
            transition: var(--transition-fast);
        }

        .schedule-search:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .event-card {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 1.5rem;
            align-items: center;
            border: 1px solid var(--glass-border);
            background: rgba(20, 20, 22, 0.4);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .event-card:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            box-shadow: 0 5px 25px rgba(0, 207, 255, 0.05);
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 0.5rem;
            text-align: center;
            min-height: 80px;
        }

        /* Color code left border of date-badge by license */
        .date-badge.rookie { border-left: 4px solid #9ca3af; }
        .date-badge.class-d { border-left: 4px solid #fb923c; }
        .date-badge.class-c { border-left: 4px solid #facc15; }
        .date-badge.class-b { border-left: 4px solid #4ade80; }
        .date-badge.class-a { border-left: 4px solid #4DA3FF; }

        .date-badge .month {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .date-badge .day {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            margin-top: 0.25rem;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .event-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .series-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
        }

        .event-meta-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .event-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .event-meta-item svg {
            opacity: 0.6;
        }

        .cars-label {
            font-size: 0.75rem;
            line-height: 1.4;
            color: var(--text-muted);
        }

        .badge-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .meta-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .meta-badge.license {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .meta-badge.license.rookie { color: #9ca3af; border-color: rgba(156, 163, 175, 0.3); }
        .meta-badge.license.class-d { color: #fb923c; border-color: rgba(251, 146, 60, 0.3); }
        .meta-badge.license.class-c { color: #facc15; border-color: rgba(250, 204, 21, 0.3); }
        .meta-badge.license.class-b { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }
        .meta-badge.license.class-a { color: #4DA3FF; border-color: rgba(77, 163, 255, 0.3); }

        .meta-badge.length {
            background: rgba(0, 207, 255, 0.1);
            color: var(--primary);
            border: 1px solid rgba(0, 207, 255, 0.2);
        }

        .meta-badge.team {
            background: rgba(255, 0, 85, 0.1);
            color: #ff0055;
            border: 1px solid rgba(255, 0, 85, 0.2);
        }

        .meta-badge.multiclass {
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        
        .no-events {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 2rem;
            background: rgba(20, 20, 22, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .event-card {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .date-badge {
                flex-direction: row;
                justify-content: flex-start;
                gap: 10px;
                min-height: auto;
                padding: 0.5rem 1rem;
            }
            .date-badge .day {
                margin: 0;
                font-size: 1.25rem;
            }
        }
    </style>

    <script>
        let allEvents = [];
        let activeCategory = "all";
        let activeLicense = "all";
        let activeTeam = "all";
        let activeMulticlass = "all";
        let activeMonth = "all";

        document.addEventListener('DOMContentLoaded', () => {
            fetch('scripts/schedule_events.json')
                .then(res => res.json())
                .then(data => {
                    allEvents = data;
                    renderSchedule();
                })
                .catch(err => {
                    console.error("Error loading schedule data:", err);
                    document.getElementById('schedule-grid').innerHTML = '<div class="no-events"><p style="color: var(--secondary); font-weight: 700;">Could not load schedule database.</p></div>';
                });
        });

        function toggleCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('#category-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-category') === cat);
            });
            renderSchedule();
        }

        function toggleLicense(lic) {
            activeLicense = lic;
            document.querySelectorAll('#license-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-license') === lic);
            });
            renderSchedule();
        }

        function toggleTeam(teamVal) {
            activeTeam = teamVal;
            document.querySelectorAll('#team-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-team') === teamVal);
            });
            renderSchedule();
        }

        function toggleMulticlass(mcVal) {
            activeMulticlass = mcVal;
            document.querySelectorAll('#multiclass-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-multiclass') === mcVal);
            });
            renderSchedule();
        }

        function toggleMonth(month) {
            activeMonth = month;
            document.querySelectorAll('#month-filters .filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-month') === month);
            });
            renderSchedule();
        }

        function filterSchedule() {
            renderSchedule();
        }

        function getLicenseClass(lic) {
            const l = String(lic).toLowerCase().replace(/\(|\)/g, '');
            if (l.includes('class b 4.0') || l.includes('class a')) return 'class-a';
            if (l.includes('class c 4.0') || l.includes('class b')) return 'class-b';
            if (l.includes('class d 4.0') || l.includes('class c')) return 'class-c';
            if (l.includes('rookie 4.0') || l.includes('class d')) return 'class-d';
            return 'rookie';
        }

        function renderSchedule() {
            const grid = document.getElementById('schedule-grid');
            if (!grid) return;

            const searchQuery = document.getElementById('schedule-search-input').value.toLowerCase().trim();

            const filtered = allEvents.filter(event => {
                // Category Filter
                const matchesCat = activeCategory === 'all' || event.category === activeCategory;
                
                // License Filter
                const matchesLic = activeLicense === 'all' || event.license.toLowerCase().includes(activeLicense.toLowerCase());
                
                // Team Format Filter
                const matchesTeam = activeTeam === 'all' || 
                                    (activeTeam === 'yes' && event.team) || 
                                    (activeTeam === 'no' && !event.team);
                                    
                // Multiclass Filter
                const matchesMulticlass = activeMulticlass === 'all' || 
                                         (activeMulticlass === 'yes' && event.multiclass) || 
                                         (activeMulticlass === 'no' && !event.multiclass);
                                         
                // Month Filter
                const matchesMonth = activeMonth === 'all' || event.date.toLowerCase().includes(activeMonth.toLowerCase());
                
                // Search Query Filter
                const matchesSearch = !searchQuery || 
                                     event.seriesName.toLowerCase().includes(searchQuery) || 
                                     event.track.toLowerCase().includes(searchQuery) || 
                                     event.cars.toLowerCase().includes(searchQuery);

                return matchesCat && matchesLic && matchesTeam && matchesMulticlass && matchesMonth && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-events"><p style="margin:0;">No matching race events found.</p></div>';
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(event => {
                const licenseClass = getLicenseClass(event.license);
                
                // Parse date string like "Jun 20" or "Jul 11" into Month and Day
                const dateParts = event.date.split(' ');
                const monthText = dateParts[0] || 'JUN';
                const dayText = dateParts[1] || '16';

                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="date-badge ${licenseClass}">
                        <span class="month">${monthText}</span>
                        <span class="day">${dayText}</span>
                    </div>
                    <div class="event-info">
                        <div class="event-header">
                            <h3 class="series-name">${event.seriesName}</h3>
                            <div class="badge-container">
                                <span class="meta-badge license ${licenseClass}">${event.license}</span>
                                <span class="meta-badge length">${event.length}</span>
                                ${event.team ? '<span class="meta-badge team">Team</span>' : '<span class="meta-badge team" style="background: rgba(255,255,255,0.05); color: var(--text-muted); border-color: rgba(255,255,255,0.1);">Solo</span>'}
                                ${event.multiclass ? '<span class="meta-badge multiclass">Multiclass</span>' : ''}
                            </div>
                        </div>
