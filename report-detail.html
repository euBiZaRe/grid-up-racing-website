    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) { window.location.href = 'reports.html'; return; }

        let attempts = 0;
        while (typeof db === 'undefined' && attempts < 20) {
            await new Promise(r => setTimeout(r, 200));
            attempts++;
        }
        if (typeof db === 'undefined') return;

        try {
            let doc;
            const slugSnap = await db.collection('reports').where('slug', '==', id).get();
            if (!slugSnap.empty) {
                doc = slugSnap.docs[0];
            } else {
                const directDoc = await db.collection('reports').doc(id).get();
                if (directDoc.exists) {
                    doc = directDoc;
                }
            }

            if (!doc) { window.location.href = 'reports.html'; return; }
            const data = doc.data();

            // Update page title
            document.title = `${data.title} | GRiD UP Race Reports`;

            // Update hero
            const heroImg = document.getElementById('report-hero-img');
            if (heroImg && data.bannerUrl) { heroImg.src = data.bannerUrl; }

            // Update meta fields
            const rawDate = data.date && data.date.toDate ? data.date.toDate() : new Date();
            const dateStr = rawDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('report-date').textContent = dateStr;
            document.getElementById('report-title').textContent = data.title;
            document.getElementById('report-author').textContent = `By ${data.author || 'GRiD UP'}`;

            // Render content
            let formattedContent = data.content || '<p style="color:var(--text-muted)">No content available.</p>';
            if (!formattedContent.includes('<p>') && !formattedContent.includes('<div')) {
                // Remove raw headers hashtags like '### Chasing Top Accomplishments'
                formattedContent = formattedContent.replace(/^(?:###|##)\s*(.+)$/gm, '<h3 style="color: var(--primary); margin-top: 2rem; margin-bottom: 1rem; font-family: var(--font-heading); font-size: 1.4rem;">$1</h3>');
                // Convert double newlines into paragraphs
                formattedContent = formattedContent.split(/\n\n+/).map(p => {
                    if (p.trim().startsWith('<h3')) return p.trim();
                    // Process bold tags **bold** -> <strong>bold</strong>
                    let processed = p.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    // Format lists
                    processed = processed.replace(/^\s*-\s*(.+)$/gm, '<li style="margin-bottom: 0.5rem; margin-left: 1.5rem; list-style-type: square; color: var(--text-main);">$1</li>');
                    if (processed.includes('<li')) {
                        processed = `<ul style="margin: 1.5rem 0; padding-left: 1rem;">${processed}</ul>`;
                    }
                    return `<p style="margin-bottom: 1.5rem; line-height: 1.8;">${processed.replace(/\n/g, '<br>')}</p>`;
                }).join('\n');
            }
            document.getElementById('report-content').innerHTML = formattedContent;

        } catch (e) {
            console.error('Error loading report:', e);
            document.getElementById('report-content').innerHTML = '<p style="color:#ff3333;">Error loading report.</p>';
        }
    });
    </script>
