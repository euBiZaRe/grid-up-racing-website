<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seed GT Challenge | GRiD UP</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body style="font-family: sans-serif; padding: 2rem; background: #0a0a0c; color: white;">
    <h1>Seeding GT Challenge Events...</h1>
    <div id="log" style="background: #000; color: #0f0; padding: 1rem; font-family: monospace; white-space: pre-wrap;">Initializing...</div>

    <script>
        async function seedGTChallenge() {
            const log = document.getElementById('log');
            log.textContent += "\nStarting seed...";

            if (typeof db === 'undefined') {
                log.textContent += "\nError: db not initialized. Waiting...";
                setTimeout(seedGTChallenge, 500);
                return;
            }

            const EVENTS = [
                {
                    id: 'gtc-virginia-120',
                    name: 'GT Challenge: Virginia 120',
                    carClass: 'GT3 // GT4',
                    description: 'Multi-class endurance at ViR. Practice starts at 3:00 PM EST, Green Flag at 4:00 PM EST.',
                    schedule: 'May 23rd // 4:00 PM EST',
                    dateDisplay: 'May 23, 2026',
                    startDate: '2026-05-23T20:00:00Z',
                    format: '120m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-glen-24',
                    name: 'GT Challenge: 2.4 at The Glen',
                    carClass: 'GT3 // GT4',
                    description: 'The classic 2.4 hour endurance at Watkins Glen. Multiclass team racing.',
                    schedule: 'June 13th // 4:00 PM EST',
                    dateDisplay: 'June 13, 2026',
                    startDate: '2026-06-13T20:00:00Z',
                    format: '144m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-spa-3h',
                    name: 'GT Challenge: 3 Hours of Spa',
                    carClass: 'GT3 // GT4',
                    description: 'High-speed endurance through the Ardennes. 3 hours of multiclass intensity.',
                    schedule: 'June 27th // 4:00 PM EST',
                    dateDisplay: 'June 27, 2026',
                    startDate: '2026-06-27T20:00:00Z',
                    format: '180m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-elkhart-24',
                    name: 'GT Challenge: Elkhart Lake 2.4',
                    carClass: 'GT3 // GT4',
                    description: 'Testing power and precision at Road America. 2.4 hour team endurance.',
                    schedule: 'July 18th // 4:00 PM EST',
                    dateDisplay: 'July 18, 2026',
                    startDate: '2026-07-18T20:00:00Z',
                    format: '144m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-barcelona-120',
                    name: 'GT Challenge: Barcelona 120',
                    carClass: 'GT3 // GT4',
                    description: 'Technical endurance racing in Spain. 120 minutes of strategic multiclass battle.',
                    schedule: 'August 8th // 4:00 PM EST',
                    dateDisplay: 'August 8, 2026',
                    startDate: '2026-08-08T20:00:00Z',
                    format: '120m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-suzuka-24',
                    name: 'GT Challenge: Suzuka 2.4',
                    carClass: 'GT3 // GT4',
                    description: 'The figure-eight challenge. 144 minutes of endurance at Japan\'s premier circuit.',
                    schedule: 'Sept 5th // 4:00 PM EST',
                    dateDisplay: 'Sept 5, 2026',
                    startDate: '2026-09-05T20:00:00Z',
                    format: '144m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-atlanta-120',
                    name: 'GT Challenge: Atlanta 120',
                    carClass: 'GT3 // GT4',
                    description: 'Rolling hills and high speed at Road Atlanta. 2 hours of multiclass racing.',
                    schedule: 'Sept 18th // 4:00 PM EST',
                    dateDisplay: 'Sept 18, 2026',
                    startDate: '2026-09-18T20:00:00Z',
                    format: '120m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-indy-3h',
                    name: 'GT Challenge: Indy 3 Hour',
                    carClass: 'GT3 // GT4',
                    description: 'Endurance at the Brickyard. 180 minutes of multiclass action at the world capital of racing.',
                    schedule: 'Oct 10th // 4:00 PM EST',
                    dateDisplay: 'Oct 10, 2026',
                    startDate: '2026-10-10T20:00:00Z',
                    format: '180m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                },
                {
                    id: 'gtc-sonoma-120',
                    name: 'GT Challenge: Sonoma Valley 120',
                    carClass: 'GT3 // GT4',
                    description: 'Season finale in the wine country. 120 minutes to decide the champions.',
                    schedule: 'Nov 14th // 4:00 PM EST',
                    dateDisplay: 'Nov 14, 2026',
                    startDate: '2026-11-14T20:00:00Z',
                    format: '120m Endurance',
                    registrationStatus: 'open',
                    registrationUrl: 'https://discord.gg/gridup'
                }
            ];

            try {
                const batch = db.batch();
                // We'll clear the old placeholder leagues and add these
                const existing = await db.collection("leagues").get();
                existing.forEach(doc => batch.delete(doc.ref));
                
                EVENTS.forEach(e => {
                    log.textContent += `\nQueueing ${e.id}...`;
                    batch.set(db.collection("leagues").doc(e.id), e);
                });
                
                await batch.commit();
                log.textContent += "\n\nSUCCESS! 9 GT Challenge events seeded.";
            } catch (e) {
                log.textContent += "\n\nError: " + e.message;
            }
        }

        setTimeout(seedGTChallenge, 1000);
    </script>
</body>
</html>
