<p>The high-octane drama of multiclass endurance sim racing was on full display as the <strong>GRiD UP GT Challenge Endurance Series</strong> rolled into the historic Watkins Glen International for Round 2 of the 9-round championship: <strong>The 2.4 at The Glen</strong>.</p>

<p>Living up to the broadcast’s prophetic title, <em>"The Race Isn't Won in Hour One,"</em> the 144-minute challenge tested the physical endurance, strategic patience, and traffic management of every team on the grid. Navigating the high-speed curves and close blue barriers of the legendary 3.4-mile "Boot" road course, drivers faced non-stop action, tyre degradation, and critical driver-swap windows.</p>

<h2>GT3 Class: Reid's Solo Masterclass & Grandstand Finish</h2>

<p>In the top-tier GT3 class, the headline of the day belonged to <strong>Jacob Reid</strong> of <strong>Burnout Racing</strong> (Car #6). Competing as a solo entry, Reid undertook the monumental task of driving the entire 2.4 hours alone. While other teams executed driver swaps during pit stops, Reid stayed in the cockpit, maintaining a relentless pace. Starting from P2 on the grid, Reid took the lead early and went on to lead 73 of the race's 81 laps. Despite picking up 19 incidents over the grueling distance, his consistency was unmatched, crossing the line to take a spectacular overall and GT3 class victory.</p>

<p>Behind Reid, the battle for the remaining podium spots was an absolute thriller that came down to the final seconds of the 2.4-hour race.</p>

<p><strong>F&F Racing</strong> (Car #99), with <strong>Faraz Ebrahim</strong> (42 laps) and <strong>Alexander Cortez</strong> (39 laps), secured a hard-fought <strong>second place</strong>, finishing 1 minute and 32.394 seconds behind Reid. Cortez also set the fastest lap of the entire race with a blistering <strong>1:44.045</strong> on Lap 7.</p>

<p>Just 1.3 seconds behind them, <strong>Joseph Francis5</strong> of the <strong>Flinkstraat Flyers</strong> (Car #22) claimed <strong>third place</strong> after a spectacular charge from 8th on the grid, completing the podium with 18 incidents.</p>

<p><strong>Levi Wolfe</strong> of <strong>Depend for Men Motorsports</strong> (Car #8) finished a very close <strong>fourth place</strong> (only 10.5 seconds behind the podium) after a heroic solo drive of all 81 laps with just 6 incidents. <strong>Dream Team</strong> (Car #2) rounded out the top five with <strong>Gabe Wilmoth</strong> (45 laps) and <strong>Terry Cantwell</strong> (35 laps) finishing one lap down.</p>

<h2>GT4 Class: Grumpy Duck Racing Triumphs</h2>

<p>In the GT4 category, the race was a masterclass in traffic management. With GT3 cars slicing through the field at high speed, GT4 drivers had to constantly monitor their mirrors through the Esses and the Boot, balancing their own battles with the need to let faster machinery past.</p>

<p><strong>Grumpy Duck Racing</strong> (Car #13) claimed a sensational class victory. The duo of <strong>Zack Saunders</strong> (40 laps) and <strong>Adam L. Jones</strong> (33 laps) drove a calculated, highly consistent race to complete 73 laps and take the checkered flag, managing their tyres perfectly through 11 total incidents.</p>

<p>They were pushed all the way by <strong>Xavier Williams</strong> of <strong>Motohaus White</strong> (Car #12), who ran a solo entry to finish in a close <strong>second place</strong> in class, on the same lap as the winners.</p>

<p>Completing the GT4 podium was <strong>Apex Racing</strong> (Car #5), with <strong>David Shreve</strong> (37 laps) and <strong>Mark Prince</strong> (35 laps) putting in a robust performance to finish <strong>third</strong>, one lap down from the class leaders. <strong>Suboptimal Line Motorsport</strong> (Car #10), driven solo by <strong>Matt Perez</strong>, finished <strong>fourth</strong> after a wild race that saw him collect 32 incidents.</p>

        async function seedReport() {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = "Starting report publishing...\n";

            if (typeof db === 'undefined') {
                logDiv.innerHTML += "<span class='error'>Firestore 'db' is not initialized. Make sure auth.js loaded correctly.</span>\n";
                return;
            }

            try {
                const snap = await db.collection("reports").where("slug", "==", reportData.slug).get();
                if (!snap.empty) {
                    logDiv.innerHTML += "Report already exists! Updating...\n";
                    const docId = snap.docs[0].id;
                    await db.collection("reports").doc(docId).update(reportData);
                    logDiv.innerHTML += "<span class='success'>Successfully updated the report!</span>\n";
                } else {
                    logDiv.innerHTML += "Inserting new report...\n";
                    await db.collection("reports").add(reportData);
                    logDiv.innerHTML += "<span class='success'>Successfully published the Watkins Glen 2.4 results report!</span>\n";
                }

            } catch (error) {
                console.error(error);
                logDiv.innerHTML += `<span class='error'>Error: ${error.message}</span>\n`;
            }
        }
